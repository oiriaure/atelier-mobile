/* ================================================================
   Idées (4.0) : Clément note ses idées par app ; le chef les lit avec un
   esprit critique (avis), les range sur une carte mentale (lecture d'ensemble)
   et, sur demande, en fait un prompt structuré pour Claude Code, rangé et cochable.
   Rubriques partagées : idee:<id>, prompt:<id> (une par élément, null = supprimé), carte:<repo>.
================================================================ */
const IP = 'idee:', PP = 'prompt:', CP = 'carte:';
const nouvelId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const rubriques = p => Object.entries(SH).filter(([k, e]) => k.startsWith(p) && e && e.v).map(([, e]) => e.v);
function idees(repo){ return rubriques(IP).filter(x => !repo || x.app === repo).sort((a, b) => b.cree - a.cree); }
function prompts(repo){ return rubriques(PP).filter(x => !repo || x.app === repo).sort((a, b) => (!!a.fait - !!b.fait) || (b.cree - a.cree)); }
const ideeGet = id => id ? get(IP + id, null) : null;
const promptGet = id => id ? get(PP + id, null) : null;
const carteGet = repo => get(CP + repo, null);
function ideePut(x){ x.maj = Date.now(); put(IP + x.id, x); }
function promptPut(p){ p.maj = Date.now(); put(PP + p.id, p); }
const txt = v => typeof v === 'string' ? v.trim() : v == null ? '' : String(v).trim();
const tab = v => Array.isArray(v) ? v : [];
// L'empreinte ignore le titre trouvé par le chef, sinon il relirait sans fin
const empreinte = x => hashTxt(`${x.app}\n${x.titreAuto ? '' : x.titre || ''}\n${x.texte}`);
const avisAJour = x => !!x.avis && x.avis.h === empreinte(x);
const ouverte = x => x.statut !== 'faite' && x.statut !== 'archivee';
const VERDICTS = {
  bonne:{l:'Validée', c:'#10b981', i:'check'},
  a_preciser:{l:'À préciser', c:'#f59e0b', i:'help'},
  a_ameliorer:{l:'À améliorer', c:'#8b5cf6', i:'spark'},
  a_revoir:{l:'À revoir', c:'#ef4444', i:'alert'}
};
function etatIdee(x){
  if(x.statut === 'faite') return {k:'faite', l:'Réalisée', c:'#10b981', i:'check'};
  if(busy['idee' + x.id] || (FILE_AVIS.has(x.id) && L.geminiKey && navigator.onLine)) return {k:'lit', l:'Le chef lit…', c:'#8b5cf6', i:'spark'};
  if(!avisAJour(x)) return {k:'attente', l:L.geminiKey ? 'En attente du chef' : 'Sans avis', c:'#94a3b8', i:'clock'};
  const v = VERDICTS[x.avis.verdict] || VERDICTS.a_preciser;
  return Object.assign({k:x.avis.verdict}, v, x.statut === 'prompt' ? {l:'Dans un prompt', c:'#0ea5e9', i:'doc'} : {});
}
const themeDe = x => carteGet(x.app)?.themes?.[x.id] || x.avis?.theme || '';
const titreIdee = x => x.titre || txt(x.texte).split('\n')[0].slice(0, 70) || 'Idée';

function ideeAjouter(app, texte, titre=''){
  const x = {id:nouvelId(), app, titre:txt(titre), titreAuto:false, texte:txt(texte), cree:Date.now(), maj:Date.now(), appareil:L.device, statut:'ouverte'};
  ideePut(x); LS.set('atelier.idees.app', app); planifierAvis(x.id); return x;
}

/* ----- Avis du chef : une idée lue avec les autres idées de l'app ----- */
const FILE_AVIS = new Set(); let avisTourne = false, avisT = 0;
function planifierAvis(id, delai=900){ FILE_AVIS.add(id); clearTimeout(avisT); avisT = setTimeout(traiterAvis, delai); }
async function traiterAvis(){
  if(avisTourne || !L.geminiKey || !navigator.onLine) return;
  avisTourne = true;
  try{
    while(FILE_AVIS.size){
      const id = FILE_AVIS.values().next().value; FILE_AVIS.delete(id);
      const x = ideeGet(id); if(!x || !ouverte(x) || avisAJour(x)) continue;
      try{ await analyserIdee(x); }
      catch(e){ C.avisErr = Object.assign({}, C.avisErr, {[id]:{h:empreinte(x), at:Date.now(), msg:e.message}}); saveC(); if(view === 'idees' || IDSHEET) toast('Avis du chef : ' + e.message, true); }
    }
  }finally{ avisTourne = false; majIdees(); }
}
// Idées sans avis (écrites hors ligne, ou sur un appareil sans clé) : l'appareil qui l'a écrite d'abord, les autres après 3 min
function avisEnAttente(){
  if(!L.geminiKey || !navigator.onLine || !Cloud.joined) return;
  for(const x of idees()){
    if(!ouverte(x) || avisAJour(x)) continue;
    const err = C.avisErr?.[x.id]; if(err && err.h === empreinte(x) && Date.now() - err.at < 3600e3) continue;
    if(x.appareil === L.device || Date.now() - x.maj > 3*60e3) FILE_AVIS.add(x.id);
  }
  if(FILE_AVIS.size) traiterAvis();
}
const ligneIdee = y => `- [${y.id}] ${titreIdee(y)} : ${clip(y.texte, 360).replace(/\s*\n\s*/g, ' ')}${y.avis ? ` (verdict : ${VERDICTS[y.avis.verdict]?.l || '?'} ; thème : ${themeDe(y) || '?'})` : ''}${y.statut === 'faite' ? ' [RÉALISÉE]' : y.statut === 'prompt' ? ' [déjà dans un prompt]' : ''}`;
async function analyserIdee(x){
  const a = appBy(x.app), h = empreinte(x);
  busy['idee' + x.id] = true; majIdees();
  try{
    const autres = idees(x.app).filter(y => y.id !== x.id && y.statut !== 'archivee').slice(0, 30);
    const themes = [...new Set(autres.map(themeDe).filter(Boolean))];
    const r = await gemini(`${ficheApp(a, false, false)}

## Autres idées de Clément pour ${a.name}
${autres.map(ligneIdee).join('\n') || 'aucune pour l\'instant'}

## Prompts déjà rédigés pour ${a.name}
${prompts(x.app).slice(0, 12).map(p => `- ${p.titre}${p.fait ? ' [fait]' : ''}`).join('\n') || 'aucun'}

## L'idée à lire (note de Clément, telle qu'il l'a écrite)
"""
${x.titre && !x.titreAuto ? x.titre + '\n' : ''}${x.texte}
"""

Lis cette idée avec ton esprit critique, en tenant compte de l'app, de son cerveau, de ses tâches, des prompts déjà faits et des autres idées. Réponds en JSON strict :
{"titre":"titre court, 2 à 6 mots","compris":"ce que tu as compris de son intention, 1 ou 2 phrases","verdict":"bonne | a_preciser | a_ameliorer | a_revoir","avis":"ton avis franc en 2 à 4 phrases : valeur, coût, risques, cohérence avec l'existant","amelioration":"la note réécrite en mieux, prête à remplacer l'originale (garde son intention, précise le comportement attendu, 2 à 6 lignes) ; chaîne vide si l'idée est bonne telle quelle","questions":["0 à 3 questions courtes qui débloquent une décision"],"liens":[{"id":"identifiant d'une autre idée ci-dessus","relation":"complète | dépend de | contredit | doublon"}],"theme":"thème de 1 à 3 mots${themes.length ? ' (réutilise si possible : ' + themes.join(', ') + ')' : ''}","effort":"petit | moyen | gros","impact":"faible | moyen | fort"}
Verdicts : bonne = claire et utile, à faire telle quelle (alors amelioration vide, n'invente aucun défaut) ; a_preciser = l'intention est bonne mais des décisions manquent (pose les questions) ; a_ameliorer = une meilleure version existe (donne-la) ; a_revoir = déjà faite, en double, risquée, contraire à une règle du cerveau ou peu utile (dis pourquoi et propose une alternative).`,
      {json:true, temperature:0.3, system:`${ROLE_CHEF}\n\n${F.critique}\n\nPlan de ta formation (${F.total} h) :\n${F.plan}\n\nModules de ta formation utiles pour cette idée :\n\n${formationPour(a, `${x.titre || ''} ${x.texte}`, 9000, ['produit'])}`});
    const y = ideeGet(x.id); if(!y) return;
    const ids = new Set(autres.map(z => z.id)), verdict = VERDICTS[r.verdict] ? r.verdict : 'a_preciser';
    let amelioration = verdict === 'bonne' ? '' : txt(r.amelioration);
    if(amelioration && hashTxt(amelioration) === hashTxt(txt(y.texte))) amelioration = '';
    y.avis = {at:Date.now(), h, verdict, compris:txt(r.compris), avis:txt(r.avis), amelioration,
      questions:tab(r.questions).map(txt).filter(Boolean).slice(0, 3),
      liens:tab(r.liens).filter(l => l && ids.has(l.id)).slice(0, 6).map(l => ({id:l.id, rel:txt(l.relation) || 'complète'})),
      theme:txt(r.theme).slice(0, 32) || 'Divers', effort:txt(r.effort) || '?', impact:txt(r.impact) || '?'};
    if((!y.titre || y.titreAuto) && txt(r.titre)){ y.titre = txt(r.titre).replace(/^["«\s]+|["».\s]+$/g, '').slice(0, 70); y.titreAuto = true; }
    if(C.avisErr?.[y.id]){ delete C.avisErr[y.id]; saveC(); }
    ideePut(y);
    planifierSynthese(y.app);
  }finally{ delete busy['idee' + x.id]; majIdees(); }
}

/* ----- Lecture d'ensemble (alimente la carte mentale) ----- */
const SYNT = {};
const empreinteCarte = repo => hashTxt(idees(repo).filter(x => x.statut !== 'archivee').map(x => `${x.id}:${x.avis?.at || 0}:${x.statut}`).join('|'));
function planifierSynthese(repo, delai=5000){ clearTimeout(SYNT[repo]); SYNT[repo] = setTimeout(() => syntheseIdees(repo).catch(e => console.warn('synthèse', e.message)), delai); }
async function syntheseIdees(repo, force=false){
  const list = idees(repo).filter(x => x.statut !== 'archivee');
  const actives = list.filter(ouverte);
  if(actives.length < 2 || !L.geminiKey || !navigator.onLine) return;

  if(!force && c?.h === h) return;
  const a = appBy(repo);
  busy['carte' + repo] = true; majIdees();
  try{
    const r = await gemini(`${ficheApp(a, false, false)}

## Toutes les idées de Clément pour ${a.name}
${list.map(x => ligneIdee(x) + (x.avis?.avis ? `\n  Avis : ${x.avis.avis}` : '')).join('\n')}

Fais la lecture d'ensemble de ces idées, comme un directeur produit exigeant. JSON strict :
{"synthese":"3 à 5 phrases : ce qui se dégage, la cohérence de l'ensemble, ton avis global franc","ordre":["identifiants des idées non réalisées, dans l'ordre conseillé (les plus utiles et les plus sûres d'abord, les dépendances avant)"],"tensions":["contradictions, doublons ou choix à trancher (0 à 4)"],"manques":["ce qui manque pour que l'ensemble tienne (0 à 3)"],"themes":{"identifiant":"thème de 1 à 3 mots, harmonisé (5 thèmes au plus pour toute l'app)"}}`,
      {json:true, temperature:0.3, system:`${ROLE_CHEF}\n\n${F.critique}\n\nModules de ta formation utiles ici :\n\n${formationPour(a, list.map(x => `${x.titre || ''} ${x.texte}`).join('\n'), 9000, ['produit', 'portefeuille'])}`});
    const ids = new Set(list.map(x => x.id)), themes = {};
    for(const [k, v] of Object.entries(r.themes || {})) if(ids.has(k) && txt(v)) themes[k] = txt(v).slice(0, 32);
    put(CP + repo, {at:Date.now(), h, synthese:txt(r.synthese), ordre:tab(r.ordre).filter(id => ids.has(id)), tensions:tab(r.tensions).map(txt).filter(Boolean).slice(0, 4), manques:tab(r.manques).map(txt).filter(Boolean).slice(0, 3), themes});
  }finally{ delete busy['carte' + repo]; majIdees(); }
}

/* ----- Prompt structuré pour Claude Code ----- */
let PCTRL = null;
async function genererPrompt(repo, ids, precision='', base=null, qualite='auto'){
  const a = appBy(repo), choisies = ids.map(ideeGet).filter(Boolean);
  if(!choisies.length) throw new Error('Choisis au moins une idée');
  const autres = idees(repo).filter(x => !ids.includes(x.id) && ouverte(x));
  const carte = carteGet(repo);
  const p = base ? Object.assign({}, base) : {id:nouvelId(), app:repo, cree:Date.now(), fait:false};
  p.idees = choisies.map(x => x.id); p.precision = txt(precision); p.qualite = qualite;
  const cx = complexite(choisies, p.precision);
  let premium = qualite === 'maximale' || (qualite === 'auto' && cx.premium), note = '';
  if(premium && !premiumDispo()){ premium = false; note = !L.claudeKey ? 'clé Claude absente' : !navigator.onLine ? 'hors ligne' : 'plafond du mois atteint'; }
  busy.prompt = p.id; PCTRL = new AbortController();
  promptEcriture(p, choisies, {premium, raisons:qualite === 'maximale' ? ['demandé'] : cx.raisons});
  try{
    const consigne = `${ficheApp(a, true, false)}

## Idées à réaliser dans ce prompt
${choisies.map((x, i) => `### ${i + 1}. ${titreIdee(x)}
Note de Clément : ${x.texte}${x.avis ? `
Compris par le chef : ${x.avis.compris}
Avis du chef : ${x.avis.avis}${x.avis.amelioration ? `\nVersion améliorée proposée par le chef (pas encore adoptée par Clément) : ${x.avis.amelioration}` : ''}${x.avis.questions.length ? `\nQuestions encore ouvertes : ${x.avis.questions.join(' | ')}` : ''}` : ''}`).join('\n\n')}

## Autres idées en attente (HORS PÉRIMÈTRE de ce prompt, à ne pas réaliser)
${autres.map(x => `- ${titreIdee(x)}`).join('\n') || 'aucune'}
${carte?.synthese ? `\n## Lecture d'ensemble du chef\n${carte.synthese}` : ''}
${p.precision ? `\n## Précision de Clément pour ce prompt\n${p.precision}` : ''}

Rédige maintenant LE prompt complet que Clément enverra tel quel à Claude Code pour réaliser ces idées dans ${a.name} (dépôt ${repo}). Suis exactement le modèle de ta formation (titres « ## »). Appuie-toi sur le cerveau de l'app : cite les fichiers, fonctions, règles et la procédure de publication qui s'y trouvent ; n'invente pas de fichier. Tranche toi-même les questions ouvertes de façon raisonnable et écris-les dans « Points à trancher » comme hypothèses. Si plusieurs idées, ordonne-les en étapes. Textes de l'interface exacts entre guillemets « ». Aucune clé ni donnée personnelle.
Réponds uniquement par le prompt, en markdown, première ligne « # Titre ». Pas de bloc de code autour, pas de phrase avant ni après.`;
    const sujet = choisies.map(x => `${titreIdee(x)} ${x.texte} ${x.avis?.amelioration || ''}`).join('\n') + ' ' + p.precision;
    const live = t => { const el = $('#promptLive'); if(el){ el.innerHTML = md(t); const sh = $('#modal .sheet'); if(sh && sh.scrollHeight - sh.scrollTop - sh.clientHeight < 240) sh.scrollTop = sh.scrollHeight; } };
    const sys = (budget, seuil) => `${ROLE_CHEF}\n\n${F.critique}\n\nModules de ta formation choisis pour ce prompt (sur ${F.total} h) :\n\n${formationPour(a, sujet, budget, ['prompts', 'agents-ia'], seuil)}`;
    const nettoie = t => t.replace(/^```(?:markdown|md)?\s*\n/, '').replace(/\n```\s*$/, '').trim();
    let texte = null, cout = 0, relu = false;
    if(premium){
      try{
        const sysC = sys(60000, 3);
        texte = nettoie(await claude(consigne, {system:sysC, max:8000, signal:PCTRL.signal, onText:live, quoi:'prompt'})); cout += CLAUDE_LAST.eur;
        ecritEtat('Relecture critique…', 'Il vérifie les fichiers cités, les critères et le périmètre.');
        try{

/* ================================================================

/* ================================================================

   seulement les notes changées ; coffres/index.json = liste. Lecture partout (écran Obsidian).

async function envoyerCoffres(force=false){
  if(!PC || coffresEnCours || !L.ghToken) return;

  coffresEnCours = true; busy.coffres = true; if(view === 'notes') render();
  try{
    const trouves = await PC.coffres(); C.coffres = trouves;
    const chemins = [...new Map([...trouves, ...(C.coffresPlus||[])].map(c => [c.chemin.toLowerCase(), c])).values()];
    const lus = [];
    for(const c of chemins){ const r = await PC.lireCoffre(c.chemin); if(r && !r.erreur && r.fichiers.length) lus.push({nom:r.nom || c.nom, fichiers:r.fichiers, config:r.config || null}); }

    if(!lus.length || (!force && C.coffresHash === hash)) return;
    const R = Cloud.repo, total = lus.reduce((n, c) => n + c.fichiers.length, 0);
    for(let essai = 0; essai < 4; essai++){
      const base = (await gh(`/repos/${R}/git/ref/heads/main`)).object.sha;
      const commit = await gh(`/repos/${R}/git/commits/${base}`);
      const arbre = await gh(`/repos/${R}/git/trees/${commit.tree.sha}?recursive=1`, {allow404:true});
      const avant = {}; for(const f of arbre?.tree || []) if(f.type === 'blob' && f.path.startsWith('coffres/')) avant[f.path] = f.sha;
      const entrees = [], garder = new Set(['coffres/index.json']);
      const index = {maj:new Date().toISOString(), appareil:L.nomAppareil || PLATEFORME, coffres:[]};
      for(const c of lus){
        index.coffres.push({nom:c.nom, slug:c.slug, notes:c.fichiers.length, maj:(x => x > 0 ? new Date(x).toISOString() : null)(Math.max(...c.fichiers.map(f => f.mtime || 0)))});
        const gp = `coffres/${c.slug}.graphe.json`, gt = JSON.stringify(analyserCoffre(c.fichiers, c.config)); garder.add(gp);
        if(avant[gp] !== await shaGit(gt)) entrees.push({path:gp, mode:'100644', type:'blob', content:gt});
        OBS.graphes[c.slug] = null;
        for(const f of c.fichiers){
          const p = `coffres/${c.slug}/${f.chemin.replace(/\\/g, '/')}`; garder.add(p);
          if(avant[p] !== await shaGit(f.texte)) entrees.push({path:p, mode:'100644', type:'blob', content:f.texte});
        }
      }
      for(const p of Object.keys(avant)) if(!garder.has(p)) entrees.push({path:p, mode:'100644', type:'blob', sha:null});
      if(!entrees.length && avant['coffres/index.json']){ C.coffresHash = hash; break; }
      entrees.push({path:'coffres/index.json', mode:'100644', type:'blob', content:JSON.stringify(index, null, 1)});
      const t = await gh(`/repos/${R}/git/trees`, {method:'POST', body:{base_tree:commit.tree.sha, tree:entrees}});
      const nc = await gh(`/repos/${R}/git/commits`, {method:'POST', body:{message:`Coffres Obsidian depuis ${L.nomAppareil || PLATEFORME} : ${plural(lus.length, 'coffre')}, ${total} notes (${entrees.length - 1} modifiées)`, tree:t.sha, parents:[base]}});
      try{ await gh(`/repos/${R}/git/refs/heads/main`, {method:'PATCH', body:{sha:nc.sha}}); }

    }
  }catch(e){ console.warn('coffres', e); C.coffresErr = e.message; }

}

/* ================================================================

    }

}

  const parBase = {}, parChemin = {};
  for(const f of fichiers){ const p = f.chemin.replace(/\\/g, '/'); (parBase[sansAccent(titreNote(p))] ||= []).push(p); parChemin[sansAccent(p.replace(/\.md$/i, ''))] = p; }

/* Couleurs (même logique que les groupes de couleur d'Obsidian : le premier groupe qui correspond gagne) */

function serie24(dates){ const out = Array(24).fill(0), now = Date.now(); for(const d of dates){ const x = Math.floor((now - new Date(d))/3600e3); if(x >= 0 && x < 24) out[23 - x]++; } return out; }
const dateCommit = c => c.commit?.committer?.date || c.commit?.author?.date;
function appareilDe(msg){ const m = (msg||'').match(/^(.*?)\s+depuis\s+(.+)$/i); if(!m) return null; const qui = m[1].trim(), ou = m[2].trim(); return qui && qui.length < 25 && !/^atelier$/i.test(qui) ? `${ou} · ${qui}` : ou; }
async function chkDonnees(s){
  const since = new Date(Date.now() - 24*3600e3).toISOString(), q = s.chemin ? `&path=${encodeURIComponent(s.chemin)}` : '';
  const id = 'd:' + s.repo + (s.chemin||'');
  try{
    const [recents, dernier] = await Promise.all([gh(`/repos/${s.repo}/commits?since=${since}&per_page=100${q}`), gh(`/repos/${s.repo}/commits?per_page=1${q}`)]);
    const last = dernier[0] ? dateCommit(dernier[0]) : null, age = last ? Date.now() - new Date(last) : Infinity;
    const appareils = {};
    for(const c of recents){ const ap = appareilDe(c.commit.message.split('\n')[0]), t = dateCommit(c); if(ap && (!appareils[ap] || appareils[ap] < t)) appareils[ap] = t; }
    const seuil = (s.seuil||60) * 60e3;
    let statut = 'ok', detail;
    if(!last){ statut = 'att'; detail = 'Aucun envoi'; }
    else if(age <= seuil) detail = `Il y a ${dureeTxt(age)} · ${plural(recents.length, 'envoi')} en 24 h`;
    else { statut = 'att'; detail = `Rien depuis ${dureeTxt(age)} · appareil éteint ?`; }
    return {id, nom:s.nom, statut, detail, quand:last, serie:serie24(recents.map(dateCommit)), appareils};
  }catch(e){
    return {id, nom:s.nom, statut:'pb', detail:(e.status === 404 || e.status === 403) ? `Accès refusé à ${s.repo.split('/')[1]}` : e.message};
  }
}
async function chkSite(s){

    if(r.type === 'opaque' || r.ok) return {id, nom, statut:'ok', detail:`En ligne · ${ms} ms`, lien:s.url};

}
async function chkPublication(a){
  const repo = a.repo, id = 'pub', nom = 'Publication';
  try{
    const [vtxt, vc] = await Promise.all([ghRaw(repo, 'publication/version.json'), gh(`/repos/${repo}/commits?path=publication/version.json&per_page=1`)]);
    if(!vtxt) return {id, nom, statut:'info', detail:'Non configurée'};
    let v; try{ v = JSON.parse(vtxt); }catch{ return {id, nom, statut:'pb', detail:'version.json illisible : mises à jour bloquées'}; }
    if(!Array.isArray(v.fichiers || v.files) && !v.version) return {id, nom, statut:'att', detail:'version.json sans version'};
    const D = vc[0] ? dateCommit(vc[0]) : null;
    const apres = D ? (await gh(`/repos/${repo}/commits?since=${encodeURIComponent(D)}&per_page=50`)).filter(c => c.sha !== vc[0].sha) : [];
    if(!apres.length) return {id, nom, statut:'ok', detail:`v${v.version || '?'} · il y a ${D ? dureeTxt(Date.now() - new Date(D)) : '?'}`, quand:D};
    const vieux = Date.now() - new Date(dateCommit(apres[apres.length - 1])) > 2*864e5;
    return {id, nom, statut:vieux ? 'att' : 'info', detail:`v${v.version || '?'} · ${plural(apres.length, 'modification')} à publier`, quand:D};
  }catch(e){ return {id, nom, statut:'att', detail:e.message}; }
}

  const [pub, prs, suivis] = await Promise.all([chkPublication(a), gh(`/repos/${repo}/pulls?state=open&per_page=20`).catch(() => []), Promise.all(suiviDe(a).map(s => s.type === 'site' ? chkSite(s) : chkDonnees(s)))]);

async function envoyer(q, d){
  d.msgs.push({r:'u', t:q, at:Date.now()}); d.msgs = d.msgs.slice(-80); discPut(d);
  busy.chat = d.id; render(); scrollBas();

function health(d){
  if(!d || !d.info) return {cls:'grey', label:d?.error ? 'erreur' : 'en attente'};

  if(days < 7) return {cls:'green', label:'actif'};
  if(days < 30) return {cls:'orange', label:'ralenti'};
  return {cls:'red', label:'à l\'arrêt'};
}
function jours14(repo){
  const out = Array(14).fill(0), t0 = new Date(); t0.setHours(0,0,0,0);
  for(const c of C.apps[repo]?.commits||[]){ const j = new Date(c.date); j.setHours(0,0,0,0); const d = Math.round((t0 - j) / 864e5); if(d >= 0 && d < 14) out[13 - d]++; }
  return out;
}
const spark = repo => { const j = jours14(repo), mx = Math.max(1, ...j); return `<div class="spark" title="Commits des 14 derniers jours">${j.map(n => `<i class="${n ? '' : 'z'}" style="height:${n ? 6 + n/mx*20 : 3}px"></i>`).join('')}</div>`; };
function serie(){
  const jours = new Set(allCommits().map(c => new Date(c.date).toDateString()));
  let n = 0; const d = new Date();
  if(!jours.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while(jours.has(d.toDateString())){ n++; d.setDate(d.getDate() - 1); }
  return n;

const libDroits = d => Object.entries(d || {}).map(([k, v]) => `${(DROITS.find(x => x[0] === k) || [k, k])[1]} : ${v === 'write' ? 'lecture/écriture' : v === 'admin' ? 'admin' : 'lecture'}`).join(' · ');
function urlNouveauToken(a){
  const p = new URLSearchParams({name:a.nom.slice(0, 40), description:(a.desc || '').slice(0, 1000), target_name:PROPRIO(), expires_in:a.expire || 'none'});
  for(const [k, v] of Object.entries(a.droits || {})) if(v) p.set(k, v);
  return 'https://github.com/settings/personal-access-tokens/new?' + p.toString();
}
// Tous les dépôts connus : apps suivies, leurs dépôts de données et sites, le cloud, ceux des tokens
function depotsConnus(){
  const l = [Cloud.repo, ...tracked().flatMap(a => [a.repo, a.donnees, ...suiviDe(a).filter(s => s.repo).map(s => s.repo), a.repo + '-mobile', a.repo + '-donnees', a.repo + '-sync']), ...(L.jetons||[]).flatMap(j => j.repos||[]), ...(C.ghDepots||[]).map(d => d.r)];
  return [...new Set(l.filter(r => r && validRepo(r)))];
}
const enTete = t => ({Accept:'application/vnd.github+json', Authorization:'Bearer ' + t});
async function infosDepot(r){
  for(const t of [jetonPour('/repos/' + r), L.ghToken, ...(L.jetons||[]).map(j => j.t)].filter((x, i, a) => x && a.indexOf(x) === i)){
    try{ const x = await fetch(`${API}/repos/${r}`, {headers:enTete(t), cache:'no-store'}); if(x.ok){ const d = await x.json(); return {r, prive:d.private, maj:d.pushed_at, desc:d.description || '', pages:d.has_pages, issues:d.open_issues_count, url:d.html_url}; } }catch{}
  }
  return null;
}
const GHV = {charge:false};
async function chargerDepots(){
  if(GHV.charge || !L.ghToken) return; GHV.charge = true; if(view === 'github') render();
  try{ const res = (await Promise.all(depotsConnus().map(infosDepot))).filter(Boolean); C.ghDepots = res; C.ghDepotsAt = Date.now(); saveC(); }
  finally{ GHV.charge = false; if(view === 'github') render(); }
}
async function testerToken(t, repos){
  const res = await Promise.all((repos||[]).map(async r => { try{ return {r, ok:(await fetch(`${API}/repos/${r}`, {headers:enTete(t), cache:'no-store'})).ok}; }catch{ return {r, ok:false}; } }));
  let valide = false; try{ const u = await fetch(`${API}/user`, {headers:enTete(t), cache:'no-store'}); valide = u.ok || u.status === 403; }catch{}
  return {valide:valide || res.some(x => x.ok), res};
}

/* ----- Carte mentale ----- */
const PALETTE = ['#8b5cf6', '#0ea5e9', '#f59e0b', '#10b981', '#ec4899', '#6366f1', '#14b8a6', '#f97316'];
function coupe(t, n, max){
  const lignes = []; let l = '';
  for(const m of String(t).split(/\s+/).filter(Boolean)){ if(l && (l + ' ' + m).length > n){ lignes.push(l); l = m; } else l = l ? l + ' ' + m : m; }
  if(l) lignes.push(l);
  const out = lignes.slice(0, max).map(x => x.length > n ? x.slice(0, n - 1) + '…' : x);
  if(lignes.length > max) out[max - 1] = out[max - 1].replace(/.?…?$/, '') + '…';
  return out.length ? out : [''];
}
function carteSVG(repo, W){
  const a = appBy(repo), list = idees(repo).filter(x => x.statut !== 'archivee');
  const groupes = new Map();
  for(const x of list){ const t = themeDe(x) || 'À lire'; if(!groupes.has(t)) groupes.set(t, []); groupes.get(t).push(x); }
  const themes = [...groupes.entries()].map(([nom, ids]) => ({nom, ids})).sort((p, q) => q.ids.length - p.ids.length);
  themes.forEach((t, i) => { t.c = t.nom === 'À lire' ? '#94a3b8' : PALETTE[i % PALETTE.length]; });
  const deux = W >= 680, M = deux ? 20 : 16;   // M : marge extérieure pour les liens entre idées
  const CW = deux ? 150 : 78, TW = deux ? 150 : 106, G1 = deux ? 46 : 12, G2 = deux ? 34 : 10;
  const IW = deux ? Math.max(150, Math.min(250, Math.floor(W / 2 - CW / 2 - G1 - TW - G2 - M))) : W - CW - G1 - TW - G2 - M;
  const fs = deux ? 13 : 12, LH = fs + 4, cpl = Math.max(10, Math.floor((IW - 30) / (fs * .55))), cplT = Math.max(8, Math.floor((TW - 14) / 6.9));
  function cote(ts){
    let y = 0; const out = [];
    for(const t of ts){
      const debut = y, feuilles = [];
      for(const x of t.ids){ const lignes = coupe(titreIdee(x), cpl, 3), h = 14 + lignes.length * LH; feuilles.push({x, lignes, y, h}); y += h + 8; }
      y -= 8;
      const tl = coupe(t.nom, cplT, 2), th = 14 + tl.length * 15;
      let hb = y - debut;
      if(hb < th){ const d = (th - hb) / 2; feuilles.forEach(f => f.y += d); y = debut + th; hb = th; }
      out.push({t, tl, th, cy:debut + hb / 2, feuilles});
      y += 20;
    }
    return {out, H:Math.max(0, y - 20)};
  }
  let droite = themes, gauche = [];
  if(deux){ droite = []; let hd = 0, hg = 0; for(const t of themes){ const hh = t.ids.length * 42 + 20; if(hd <= hg){ droite.push(t); hd += hh; } else { gauche.push(t); hg += hh; } } }
  const D = cote(droite), G = cote(gauche), pad = 18, CH = 96;
  const H = Math.max(D.H, G.H, CH) + pad * 2, cx = deux ? W / 2 : CW / 2, cy = H / 2;
  const parts = [], noeuds = [], pos = {};
  const courbe = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return `M${x1.toFixed(1)},${y1.toFixed(1)} C${mx.toFixed(1)},${y1.toFixed(1)} ${mx.toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`; };
  function dessiner(side, sens){
    const off = pad + (H - pad * 2 - side.H) / 2;
    for(const g of side.out){
      const ty = off + g.cy, tx = sens > 0 ? cx + CW / 2 + G1 : cx - CW / 2 - G1 - TW;
      parts.push(`<path d="${courbe(sens > 0 ? cx + CW / 2 : cx - CW / 2, cy, sens > 0 ? tx : tx + TW, ty)}" stroke="${g.t.c}" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".8"/>`);
      noeuds.push(`<g class="mt"><rect x="${tx}" y="${(ty - g.th / 2).toFixed(1)}" width="${TW}" height="${g.th}" rx="${Math.min(14, g.th / 2)}" fill="${g.t.c}" fill-opacity=".16" stroke="${g.t.c}" stroke-opacity=".6"/>${g.tl.map((l, i) => `<text x="${tx + TW / 2}" y="${(ty - (g.tl.length - 1) * 7.5 + i * 15 + 4.5).toFixed(1)}" text-anchor="middle" class="mtt" fill="${g.t.c}">${esc(l)}</text>`).join('')}</g>`);
      for(const f of g.feuilles){
        const fy = off + f.y, fx = sens > 0 ? tx + TW + G2 : tx - G2 - IW, e = etatIdee(f.x);
        parts.push(`<path d="${courbe(sens > 0 ? tx + TW : tx, ty, sens > 0 ? fx : fx + IW, fy + f.h / 2)}" stroke="${g.t.c}" stroke-width="1.5" fill="none" opacity=".45"/>`);
        pos[f.x.id] = {x:fx, y:fy, h:f.h, sens};
        noeuds.push(`<g class="mn ${e.k}" data-action="idOuvrir" data-id="${esc(f.x.id)}" role="button" tabindex="0" aria-label="${esc(titreIdee(f.x))}"><rect x="${fx}" y="${fy.toFixed(1)}" width="${IW}" height="${f.h}" rx="11" class="mnr"/><circle cx="${fx + 13}" cy="${(fy + f.h / 2).toFixed(1)}" r="4.5" fill="${e.c}"/>${f.lignes.map((l, i) => `<text x="${fx + 25}" y="${(fy + 7 + (i + 1) * LH - 4).toFixed(1)}" class="mnt" font-size="${fs}">${esc(l)}</text>`).join('')}</g>`);
      }
    }
  }
  dessiner(D, 1); if(deux) dessiner(G, -1);
  const vus = new Set();
  for(const x of list) for(const l of x.avis?.liens || []){
    const k = [x.id, l.id].sort().join('|'), A = pos[x.id], B = pos[l.id];
    if(vus.has(k) || !A || !B || A.sens !== B.sens) continue; vus.add(k);
    const ax = A.sens > 0 ? A.x + IW : A.x, bx = B.sens > 0 ? B.x + IW : B.x, ay = A.y + A.h / 2, by = B.y + B.h / 2, b = A.sens * (M - 2);
    const col = /contredit/.test(l.rel) ? '#ef4444' : /doublon/.test(l.rel) ? '#f59e0b' : 'var(--mu)';
    parts.push(`<path d="M${ax},${ay.toFixed(1)} C${ax + b},${ay.toFixed(1)} ${bx + b},${by.toFixed(1)} ${bx},${by.toFixed(1)}" stroke="${col}" stroke-width="1.4" stroke-dasharray="3 4" fill="none" opacity=".75"><title>${esc(l.rel)}</title></path>`);

  async brainPR(el){
    const repo = SHEET.repo, d = C.apps[repo] || {}, a = appBy(repo);
    const add = $('#brainAdd').value.trim(); if(!add) return;
    el.disabled = true; el.innerHTML = spin('Envoi sur GitHub…');
    try{
      const base = d.info?.default_branch || 'main', path = el.dataset.mode === 'create' ? 'CLAUDE.md' : d.brain.path;
      const ref = await gh(`/repos/${repo}/git/ref/heads/${encodeURIComponent(base)}`);
      const branch = `atelier/cerveau-${new Date().toISOString().slice(0,16).replace(/[-:T]/g,'')}`;
      await gh(`/repos/${repo}/git/refs`, {method:'POST', body:{ref:'refs/heads/' + branch, sha:ref.object.sha}});
      let content = add + '\n', sha;
      if(el.dataset.mode !== 'create'){
        const meta = await gh(`/repos/${repo}/contents/${encPath(path)}?ref=${encodeURIComponent(branch)}`);
        sha = meta.sha;
        const current = meta.content ? b64utf8(meta.content) : await ghRaw(repo, path);
        content = current.replace(/\s*$/, '') + '\n\n' + add + '\n';
      }
      await gh(`/repos/${repo}/contents/${encPath(path)}`, {method:'PUT', body:{message:`Cerveau : ${el.dataset.mode === 'create' ? 'création' : 'mise à jour'} proposée par Atelier`, content:utf8b64(content), branch, ...(sha ? {sha} : {})}});
      const pr = await gh(`/repos/${repo}/pulls`, {method:'POST', body:{title:`Cerveau de ${a.name} : ${el.dataset.mode === 'create' ? 'création' : 'mise à jour'}`, head:branch, base, body:`Proposé par Atelier, relu par Clément.\n\nAjoute la section au fichier \`${path}\`.`}});
      setAi(repo, {pr:pr.html_url});
      modal(`<h2>Proposition envoyée</h2><p>Pull request #${pr.number} ouverte sur ${esc(repo)}.</p>
        <div class="btns"><a class="btn ghost" href="${esc(pr.html_url)}" target="_blank" rel="noopener">Voir sur GitHub ${ic('ext','s')}</a><button class="btn primary" data-action="mergePR" data-n="${pr.number}" data-branch="${esc(branch)}">Fusionner maintenant</button></div>`);
    }catch(e){ el.disabled = false; el.textContent = 'Réessayer'; throw e; }

  async ajoutJetonGo(){

    const H = x => ({Accept:'application/vnd.github+json', Authorization:'Bearer ' + x});
    const essai = async (r, x) => { try{ return (await fetch(`${API}/repos/${r}`, {headers:H(x), cache:'no-store'})).ok; }catch{ return false; } };
    const res = await Promise.all(cands.map(async r => ({r, nouveau:await essai(r, t), principal:await essai(r, L.ghToken)})));

    L.jetons = [...(L.jetons||[]).filter(j => j.t !== t), {t, nom:$('#njN').value.trim() || 'Token ' + repos[0].split('/')[1], repos, cree:Date.now()}]; saveL();

let PAL = {items:[], i:0};
function palItems(q){
  q = q.toLowerCase().trim();
  const items = [
    ...Object.entries(VUES).map(([k, v]) => ({ic:v.i, t:v.t, k:'Aller à', run:() => go(k)})),
    {ic:'plus', t:'Nouvelle idée', k:'N', run:() => ACTIONS.capture()},
    {ic:'plus', t:'Nouvelle tâche', k:'GitHub', run:() => ACTIONS.captureTache()},
    ...idees().filter(x => x.statut !== 'archivee').map(x => ({av:appBy(x.app), t:titreIdee(x), k:'Idée · ' + etatIdee(x).l, run:() => ideeSheet(x.id)})),
    ...prompts().map(p => ({ic:'doc', t:p.titre, k:p.fait ? 'Prompt fait' : 'Prompt', run:() => promptSheet(p.id)})),
    {ic:'spark', t:'Que faire maintenant ?', k:'Analyse', run:() => { go('today'); ACTIONS.advise().catch(e => toast(e.message, true)); }},
    {ic:'chart', t:'Bilan de la semaine', k:'Analyse', run:() => { go('today'); ACTIONS.weekly().catch(e => toast(e.message, true)); }},
    {ic:'sync', t:'Tout actualiser', k:'R', run:() => syncAll()},
    {ic:'pulse', t:'Vérifier les synchros', k:'Synchro', run:() => { go('sync'); verifierTout(true); }},
    {ic:'chef', t:'Nouvelle discussion', k:'Chef', run:() => { go('chef'); ACTIONS.newDisc(); }},
    ...discs().map(d => ({av:d.app ? appBy(d.app) : {emoji:'✦', couleur:'#6366f1'}, t:d.titre, k:'Discussion', run:() => { discOuvrir(d.id); go('chef'); }})),
    ...tracked().map(a => ({av:a, t:a.name, k:'App', run:() => appSheet(a.repo)})),
    ...Object.entries(OBS.arbre || C.obsArbre || {}).flatMap(([sl, ns]) => ns.map(n => ({ic:'vault', t:titreNote(n.p), k:'Note', run:() => { OBS.coffre = sl; OBS.note = n.p; go('notes'); }}))),
    ...tracked().flatMap(a => (C.apps[a.repo]?.issues||[]).map(i => ({av:a, t:i.title, k:'Tâche #' + i.number, run:() => ACTIONS.issuePrompt({dataset:{repo:a.repo, n:i.number}}).catch(e => toast(e.message, true))})))
  ];
  return (q ? items.filter(x => (x.t + ' ' + x.k).toLowerCase().includes(q)) : items).slice(0, 40);
}
function drawPal(){
  $('#palList').innerHTML = PAL.items.map((x, i) => `<div class="it ${i === PAL.i ? 'on' : ''}" data-pi="${i}">${x.av ? avatar(x.av, 's') : ic(x.ic)}<span class="clamp1">${esc(x.t)}</span><span class="k">${esc(x.k)}</span></div>`).join('') || '<div class="empty sm">Aucun résultat</div>';

document.addEventListener('keydown', e => {

let MAJ_VUE = false;
async function verifierVersion(){
  if(MAJ_VUE || !navigator.onLine || !/github\.io$/.test(location.hostname)) return;
  try{
    const t = await (await fetch('./index.html?v=' + Date.now(), {cache:'no-store'})).text();

  }catch{}
}
