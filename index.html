<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier</title>
<meta name="description" content="Tous mes projets d'apps, au même endroit.">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://api.github.com">
<link rel="preconnect" href="https://generativelanguage.googleapis.com">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<script>try{if(JSON.parse(localStorage.getItem('atelier.local')||'{}').verre!==false)document.documentElement.classList.add('verre')}catch(e){document.documentElement.classList.add('verre')}</script>
<style>
/* ===== Atelier 3 — système de design ===== */
:root{
  --bg:#f6f7fb;--s1:#ffffff;--s2:#f0f2f7;--s3:#e7eaf1;--tx:#0e1220;--tx2:#3b4252;--mu:#6b7385;--bd:#e3e6ee;
  --ac:#5b5bf0;--ac2:#7c5cf0;--acs:#ecebff;--ok:#10b981;--wa:#f59e0b;--ko:#ef4444;--gr:#9aa3b2;
  --r3:20px;--sh1:0 1px 2px rgba(16,24,40,.05);--sh2:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --sh3:0 20px 60px rgba(16,24,40,.18);--ease:cubic-bezier(.2,.8,.2,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0d12;--s1:#13161d;--s2:#1a1e27;--s3:#232834;--tx:#eef1f6;--tx2:#c6ccd8;--mu:#8a93a5;--bd:#242a36;
  --ac:#8080ff;--ac2:#a78bfa;--acs:#22244a;--sh1:none;--sh2:none;--sh3:0 20px 60px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.5 var(--font);overflow-x:clip;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
a{color:var(--ac);text-decoration:none}
button{font:inherit;color:inherit}
button,nav,.btn,.chips,.seg{-webkit-user-select:none;user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
svg.i.s{width:16px;height:16px;vertical-align:-3px}
.muted{color:var(--mu)} .sm{font-size:13px} .xs{font-size:12px} .err{color:var(--ko);font-size:13px} .ok{color:var(--ok)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Mise en page ===== */
#shell{min-height:100vh}
#side{display:none}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
#top.scrolled{border-bottom-color:var(--bd)}
#top h1{margin:0;font-size:26px;line-height:1.1;letter-spacing:-.025em;font-weight:750}
#top small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.hacts{display:flex;gap:8px;align-items:center}
main{max-width:1180px;margin:0 auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 150px)}
.ibtn{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--s2);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .1s}
.ibtn:hover{background:var(--s3)} .ibtn:active{transform:scale(.94)}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-around;
  padding:4px 4px calc(env(safe-area-inset-bottom) + 2px);background:color-mix(in srgb,var(--s1) 90%,transparent);
  backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--bd)}
#tabs button{flex:1;border:0;background:none;color:var(--mu);font-size:10.5px;font-weight:550;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;min-height:52px;cursor:pointer;position:relative}
#tabs button svg.i{width:24px;height:24px}
#tabs button.on{color:var(--ac)}
#tabs button.on svg.i{stroke-width:2.2}
.badge{background:var(--ko);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 5px;font-weight:700;text-align:center}
#tabs .badge{position:absolute;top:3px;left:calc(50% + 6px)}
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:7;width:56px;height:56px;border-radius:18px;border:0;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(91,91,240,.45);cursor:pointer;transition:transform .25s var(--ease),opacity .25s}
#fab svg.i{width:26px;height:26px;stroke-width:2.4}
#fab.hide{transform:translateY(120px);opacity:0}
#fab[hidden]{display:none}
@media (min-width:700px){
  #shell{display:grid;grid-template-columns:260px minmax(0,1fr)}
  #side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;padding:18px 14px;background:var(--s1);border-right:1px solid var(--bd);overflow:auto}
  #tabs,#fab,#ptr{display:none!important}
  #top{padding:22px 32px 14px}
  #top h1{font-size:30px}
  main{padding:4px 32px 60px}
  .phone-only{display:none!important}
}
@media (max-width:699px){.desk-only{display:none!important}}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px}
.brand img{width:36px;height:36px;border-radius:10px;box-shadow:var(--sh1)}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--mu);font-size:12px}
.slabel{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:0 10px;margin-top:4px}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.kbd{font:11px var(--mono);background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;color:var(--mu)}
.searchbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);border-radius:10px;padding:8px 10px;cursor:pointer;width:100%}
.searchbtn .kbd{margin-left:auto}

/* ===== Composants ===== */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r3);padding:16px;margin:12px 0;box-shadow:var(--sh2)}
.card h2{margin:0;font-size:17px;letter-spacing:-.01em}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 4px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--tx);transition:background .15s,transform .1s,opacity .15s}
.btn:hover{background:var(--s3)} .btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 14px rgba(91,91,240,.3)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1px solid var(--bd)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;font-weight:550;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:550;color:var(--tx2);margin:2px 4px 2px 0;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.green{background:var(--ok)}.orange{background:var(--wa)}.red{background:var(--ko)}.grey{background:var(--gr)}
.av{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c,#5b5bf0) 16%,var(--s1));border:1px solid color-mix(in srgb,var(--c,#5b5bf0) 25%,transparent)}
.av.s{width:28px;height:28px;border-radius:8px;font-size:15px}
.av.xs{width:18px;height:18px;border-radius:5px;font-size:11px;display:inline-grid;vertical-align:-4px;box-shadow:none}
.av.l{width:56px;height:56px;border-radius:16px;font-size:30px}
.av.img{background:none;border:0;overflow:hidden;box-shadow:0 2px 8px rgba(16,24,40,.18)}
.av.img img{width:100%;height:100%;display:block;border-radius:inherit}
label.f{display:block;font-size:13px;font-weight:550;color:var(--tx2);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
textarea{resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--tx);cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--ac);flex:none}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:var(--sh2)}
.help{font-size:12.5px;color:var(--mu);margin:6px 0 0}
.skel{background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;flex:none}
.empty{text-align:center;padding:36px 16px;color:var(--mu)}
.empty .big{font-size:40px;margin-bottom:6px}
.empty h3{color:var(--tx);margin:4px 0 6px;font-size:18px}

/* ===== Aujourd'hui ===== */
.hello{margin:6px 4px 14px}
.hello h2{margin:0;font-size:22px;letter-spacing:-.02em}
.hello p{margin:3px 0 0;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh1)}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:12px;color:var(--mu)}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;gap:0 18px}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#a855f7);color:#fff;border:0;box-shadow:0 10px 30px rgba(79,70,229,.3)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.hero h2{font-size:19px}
.hero p{color:rgba(255,255,255,.88)}
.hero .btn{background:rgba(255,255,255,.18);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.28)}
.hero .btn.primary{background:#fff;color:#4338ca;box-shadow:none}
.act{position:relative;z-index:1;display:flex;gap:12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px;margin-top:10px}
.act .n{flex:none;width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:700;font-size:13px}
.act h4{margin:0 0 2px;font-size:15px}
.act .meta{font-size:12.5px;color:rgba(255,255,255,.8)}
.act .btns{margin-top:8px}
.live{border-left:4px solid var(--ok)}
.live .t{font-weight:650;font-size:15px;margin-top:4px}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--bd);color:var(--tx)}
.fi:last-child{border-bottom:0}
.fi .tx{flex:1}
.fi .when{color:var(--mu);font-size:12px;white-space:nowrap}

/* ===== Apps ===== */
.agrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.acard{position:relative;cursor:pointer;margin:0;transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}
.acard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 40%,var(--bd))}
.acard:active{transform:scale(.99)}
.acard .top{display:flex;gap:12px;align-items:center}
.acard .nm{font-weight:700;font-size:16.5px;letter-spacing:-.01em}
.acard .note{margin:10px 0 0;font-size:13.5px;color:var(--tx2)}
.acard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:12px}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px}
.spark i{display:block;width:5px;border-radius:2px;background:var(--c);opacity:.85;min-height:2px}
.spark i.z{background:var(--s3);opacity:1}

/* ===== Tâches ===== */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--s1);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.trow{display:flex;gap:10px;align-items:flex-start;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:11px 10px 11px 0;margin-bottom:8px;box-shadow:var(--sh1)}
.trow .bar{width:4px;align-self:stretch;border-radius:0 4px 4px 0;background:var(--c);flex:none}
.trow .tt{flex:1;padding-top:7px;font-size:15px;line-height:1.35}
.trow .tt .meta{display:block;font-size:12px;color:var(--mu);margin-top:3px}
.trow .acts{display:flex;gap:6px}

/* ===== Chef ===== */
.chatwrap{max-width:780px;margin:0 auto}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.5}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.m{align-self:flex-start;background:var(--s1);border:1px solid var(--bd);border-bottom-left-radius:6px;box-shadow:var(--sh1)}
.msg .mact{display:flex;gap:6px;margin-top:8px}
.composer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:6;padding:8px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.composer .in{display:flex;gap:8px;max-width:780px;margin:0 auto;align-items:flex-end}
.composer textarea{border-radius:22px;padding:11px 16px;min-height:46px;max-height:140px;background:var(--s1)}
.send{flex:none;width:46px;height:46px;border-radius:23px;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;cursor:pointer}
@media (min-width:700px){.composer{left:var(--sidew,256px);bottom:0;padding:14px 32px 18px}}
body.chef main{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
.sugg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:10px}
.sugg button{text-align:left;border:1px solid var(--bd);background:var(--s1);border-radius:14px;padding:12px;cursor:pointer;font-size:14px;color:var(--tx2)}
.sugg button:hover{border-color:var(--ac)}

/* ===== Markdown ===== */
.nitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--tx);text-align:left;padding:9px 8px;border-radius:10px;cursor:pointer;font:inherit;font-size:14.5px}.nitem:hover{background:var(--s2)}.nitem .xs{margin-left:auto;flex-shrink:1}.ndos summary{cursor:pointer;padding:9px 6px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;list-style:none}.ndos summary::-webkit-details-marker{display:none}.ndos .nitem{padding-left:22px}.toks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin:10px 0}.tok{border:1px solid var(--bd);border-radius:14px;padding:12px;background:var(--s2)}.tokh{display:flex;gap:10px;align-items:center}.tokh .stp{flex:none;position:static}.tokh>div{min-width:0}
.etq{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--s3,var(--s2));border:1px solid var(--bd);margin:2px 3px 0 0;white-space:nowrap}.etq.pub{color:#f59e0b;border-color:#f59e0b55}
.dep{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--bd)}.dep:first-of-type{border-top:0}
.modeles{display:grid;gap:8px}.modele{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer}.modele span{display:flex;flex-direction:column;gap:2px}.modele input{margin-top:3px}
.drt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}.repos{display:flex;flex-wrap:wrap;gap:6px 14px}.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:17px;height:17px;margin:0}
.etapes{margin:0;padding-left:20px;display:grid;gap:12px}.etapes li.fait{opacity:.7}.etapes .btns{margin-top:6px}
.gcard{padding:0;overflow:hidden}.gbox{position:relative;height:min(68vh,640px);background:var(--s1)}#gcv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.gtools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px}.gtools input{flex:1;max-width:320px;background:color-mix(in srgb,var(--s1) 85%,transparent);backdrop-filter:blur(8px)}
.gsel{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--s2) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--bd);box-shadow:var(--sh2)}
.gsel[hidden],.gtools [hidden]{display:none}.gcharge{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu)}
.gdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.gleg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 14px 0;font-size:12.5px;color:var(--tx2)}.gleg span{display:flex;align-items:center;gap:6px}.gleg i{width:10px;height:10px;border-radius:50%}
.gcard>p{padding:0 14px 12px}
.otag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);margin:1px 2px}
.callout{border-left:4px solid rgb(var(--cc));background:rgba(var(--cc),.12);border-radius:10px;padding:8px 12px;margin:10px 0}.callout .cot{font-weight:700;color:rgb(var(--cc));margin-bottom:2px}.callout .md{margin:0}

.md .cit{border-left:3px solid #7c3aed;padding:2px 0 2px 12px;margin:4px 0;color:var(--tx2)}.md a.wl{color:var(--ac);text-decoration:none;border-bottom:1px dashed}

/* ===== Feuilles (téléphone) / panneau latéral (ordinateur) ===== */
#modal{position:fixed;inset:0;z-index:30;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
#modal[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--s1);width:100%;max-width:760px;max-height:calc(100dvh - env(safe-area-inset-top) - 20px);overflow:auto;overscroll-behavior:contain;
  border-radius:24px 24px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);box-shadow:var(--sh3);animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(40%)}}
.grab{position:sticky;top:-8px;z-index:3;display:flex;justify-content:flex-end;align-items:center;margin:-8px -18px 2px;padding:10px 12px 4px;background:var(--s1);touch-action:none}
.grab::before{content:"";position:absolute;left:50%;top:7px;transform:translateX(-50%);width:40px;height:5px;border-radius:3px;background:var(--s3)}
.sheet h2{margin:2px 0 4px;font-size:22px;letter-spacing:-.02em}
@media (min-width:700px){
  #modal{align-items:center}
  #modal.drawer{justify-content:flex-end;align-items:stretch}
  .sheet{border-radius:22px;max-height:88vh;width:min(620px,92vw);animation:pop .22s var(--ease)}
  #modal.drawer .sheet{width:min(640px,96vw);max-width:none;max-height:none;height:100vh;border-radius:0;animation:slide .28s var(--ease);padding:8px 28px 28px}
  .grab::before{display:none}
}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:12px -4px 4px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs2 button.on{color:var(--tx);border-bottom-color:var(--ac)}

/* ===== Palette de commandes ===== */
#pal{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
#pal[hidden]{display:none}
#pal .box{width:min(620px,94vw);background:var(--s1);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh3);overflow:hidden;animation:pop .18s var(--ease)}
#pal input{border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;padding:16px 18px;font-size:17px;box-shadow:none}
#pal .list{max-height:55vh;overflow:auto;padding:6px}
#pal .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer}
#pal .it.on{background:var(--acs)}
#pal .it .k{margin-left:auto;font-size:12px;color:var(--mu);white-space:nowrap}

/* ===== Accueil (première connexion) ===== */
#onb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,color-mix(in srgb,var(--ac) 30%,transparent),transparent),radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,var(--ac2) 28%,transparent),transparent),var(--bg)}
#onb[hidden]{display:none}
#onb .box{width:min(460px,100%);text-align:center}
#onb img{width:76px;height:76px;border-radius:22px;box-shadow:0 16px 40px rgba(91,91,240,.35)}
#onb h1{font-size:30px;letter-spacing:-.03em;margin:18px 0 6px}
#onb p{color:var(--mu);margin:0 0 20px}
#onb .card{text-align:left}

/* ===== Divers ===== */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 66px);z-index:60;display:flex;gap:10px;align-items:center;width:max-content;
  background:var(--tx);color:var(--bg);padding:11px 14px;border-radius:14px;font-size:14px;font-weight:550;max-width:min(92vw,520px);box-shadow:var(--sh3)}
#toast[hidden]{display:none}
#toast.bad{background:var(--ko);color:#fff}
#toast button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:8px;padding:4px 10px;font-weight:650;cursor:pointer}
@media (min-width:700px){#toast{top:auto;bottom:24px;left:calc(50% + var(--sidew,256px) / 2)}}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);z-index:4;transform:translate(-50%,-70px);width:38px;height:38px;border-radius:19px;background:var(--s1);border:1px solid var(--bd);display:grid;place-items:center;color:var(--ac);transition:transform .2s;box-shadow:var(--sh2)}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);font-weight:550}
.cloud.ok svg{color:var(--ok)} .cloud.err{color:var(--ko)}
.qr{background:#fff;border-radius:16px;padding:12px;width:min(260px,70vw);margin:12px auto}
.qr svg{display:block;width:100%;height:auto}
details>summary{cursor:pointer;color:var(--mu);font-weight:550;font-size:13.5px;list-style:none;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.kv{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.appedit{border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px;background:var(--s2)}
.appedit .r{display:grid;grid-template-columns:52px 46px 1fr 44px;gap:8px}
.appedit .r2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
@media (min-width:600px){.appedit .r2{grid-template-columns:1.2fr 1fr 1fr}}
.appedit input{background:var(--s1)}
.appedit input[type=color]{padding:4px;height:46px}
.dev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.dev:last-of-type{border-bottom:0}
/* ===== Synchro (3.1) ===== */
.badge.warn{background:var(--wa)}
.banner{display:flex;gap:14px;align-items:center;border-radius:20px;padding:16px;margin:6px 0 14px;border:1px solid var(--bd);background:var(--s1);box-shadow:var(--sh2)}
.banner .bic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.banner.ok .bic{background:var(--ok)} .banner.att .bic{background:var(--wa)} .banner.pb .bic{background:var(--ko)} .banner.inf .bic{background:var(--ac)}
.banner.pb{border-color:color-mix(in srgb,var(--ko) 45%,var(--bd))}
.banner b{font-size:17px}
@media (max-width:520px){.banner{flex-wrap:wrap}.banner>.btn{width:100%}}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sgrid{display:grid;gap:0 16px}
@media (min-width:1100px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scard{border-top:3px solid var(--c)}
.stp{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:650;border-radius:99px;padding:3px 10px}
.stp.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)} .stp.att{background:color-mix(in srgb,var(--wa) 18%,transparent);color:var(--wa)} .stp.pb{background:color-mix(in srgb,var(--ko) 15%,transparent);color:var(--ko)}
.srow{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.srow .snm{font-weight:600;font-size:14.5px}
.sic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;margin-top:1px}
.sic.ok{background:var(--ok)} .sic.att{background:var(--wa)} .sic.pb{background:var(--ko)} .sic.inf{background:var(--gr)}
.tl{display:flex;align-items:flex-end;gap:2px;height:24px;margin-top:8px}
.tl i{flex:1;max-width:12px;border-radius:2px;background:var(--c,var(--ac));opacity:.85}
.tl i.z{background:var(--s3);opacity:1}
.tlx{display:flex;justify-content:space-between;max-width:330px}
/* ===== Discussions (3.1) ===== */
.chefw{display:block}
@media (min-width:1100px){.chefw{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}}
.dlist{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto;padding-bottom:20px}
.ditem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:9px 8px;cursor:pointer}
.ditem:hover{background:var(--s2)} .ditem.on{background:var(--acs)}
.ditem .dt{display:block;font-weight:600;font-size:14.5px}
.thd{position:sticky;top:calc(env(safe-area-inset-top) + 64px);z-index:4;display:flex;gap:10px;align-items:center;padding:10px 0;background:var(--bg)}
@media (min-width:700px){.thd{top:86px}}
.thd .ibtn{width:36px;height:36px}

.msg .mact .mt{margin:0 0 0 auto;align-self:center}
.send.stop{background:var(--ko)}
#micBtn.on{background:var(--ko);color:#fff;animation:pl 1.5s infinite}
.md .code{position:relative}
.md .code .cpy{position:absolute;top:6px;right:6px;border:0;border-radius:8px;background:var(--s1);color:var(--tx2);width:30px;height:30px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh1)}
.hero .md .code .cpy{background:rgba(255,255,255,.2);color:#fff}
.dpick{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:10px}
.dpick button{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);background:var(--s1);border-radius:14px;padding:10px;cursor:pointer;font-weight:600;text-align:left}
.dpick button:hover{border-color:var(--ac)}

/* ===== Liquid Glass (3.8) : verre translucide, flou et reflets, sur un fond coloré vivant ===== */
html.verre{
  --g-bg:rgba(255,255,255,.52);--g-bg2:rgba(255,255,255,.38);--g-fort:rgba(255,255,255,.72);
  --g-bord:rgba(255,255,255,.75);--g-bord2:rgba(255,255,255,.35);--g-reflet:rgba(255,255,255,.85);
  --g-ombre:0 10px 34px rgba(31,38,90,.14),0 2px 6px rgba(31,38,90,.06);
  --g-flou:saturate(190%) blur(22px);--g-flou2:saturate(170%) blur(14px);
  --s1:rgba(255,255,255,.62);--s2:rgba(255,255,255,.42);--s3:rgba(255,255,255,.6);--bd:rgba(255,255,255,.55);--acs:rgba(91,91,240,.16);
  --tx2:#2f3647;--mu:#5d6578;
}
@media (prefers-color-scheme:dark){html.verre{
  --g-bg:rgba(30,33,48,.42);--g-bg2:rgba(40,44,62,.32);--g-fort:rgba(24,26,38,.72);
  --g-bord:rgba(255,255,255,.16);--g-bord2:rgba(255,255,255,.07);--g-reflet:rgba(255,255,255,.28);
  --g-ombre:0 12px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.25);
  --s1:rgba(34,37,54,.55);--s2:rgba(255,255,255,.07);--s3:rgba(255,255,255,.12);--bd:rgba(255,255,255,.1);--acs:rgba(128,128,255,.2);
  --tx2:#d3d8e4;--mu:#9aa3b8;
}}
html.verre body{background:#e9ecf8}
@media (prefers-color-scheme:dark){html.verre body{background:#07080d}}
#fond{display:none}
html.verre #fond{display:block;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
html.verre #fond i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:derive 28s ease-in-out infinite alternate}
html.verre #fond i:nth-child(1){width:60vmax;height:60vmax;left:-18vmax;top:-20vmax;background:radial-gradient(circle,#6d6af8 0%,transparent 68%)}
html.verre #fond i:nth-child(2){width:52vmax;height:52vmax;right:-20vmax;top:8vh;background:radial-gradient(circle,#c04af0 0%,transparent 68%);animation-duration:34s;animation-delay:-8s}
html.verre #fond i:nth-child(3){width:56vmax;height:56vmax;left:10vw;bottom:-28vmax;background:radial-gradient(circle,#18b9c9 0%,transparent 66%);animation-duration:40s;animation-delay:-16s}
html.verre #fond i:nth-child(4){width:34vmax;height:34vmax;right:8vw;bottom:6vh;background:radial-gradient(circle,#ff7aa8 0%,transparent 66%);opacity:.55;animation-duration:30s;animation-delay:-4s}
@media (prefers-color-scheme:dark){html.verre #fond i{opacity:.5}}
@keyframes derive{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,7vh) scale(.94)}}

/* La matière : fond translucide + flou + bord clair + reflet en haut */
html.verre :where(.card,.kpi,.trow,.tok,.dpick button,.msg.m,.gsel,.searchbtn),html.verre :is(#side,#tabs,#modal .sheet,#toast,#ptr){
  background:var(--g-bg);-webkit-backdrop-filter:var(--g-flou);backdrop-filter:var(--g-flou);
  border:1px solid var(--g-bord2);
  box-shadow:inset 0 1px 0 var(--g-reflet),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 .5px var(--g-bord),var(--g-ombre);
}
html.verre .card{border-radius:26px;position:relative}
html.verre .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.06) 28%,transparent 55%,rgba(255,255,255,.05) 100%);mix-blend-mode:soft-light}
html.verre .card>*{position:relative}
html.verre .kpi{border-radius:22px}
html.verre .trow{border-radius:20px}
html.verre .tok{background:var(--g-bg2)}
html.verre .scard{border-top:1px solid var(--g-bord2);box-shadow:inset 0 3px 0 -1px var(--c),inset 0 1px 0 var(--g-reflet),var(--g-ombre)}

/* Barre du haut et barre latérale */
html.verre #top,html.verre #top.scrolled{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom-color:transparent;box-shadow:none}
@media (min-width:700px){
}

/* Barre d'onglets du téléphone : une capsule de verre qui flotte */
@media (max-width:699px){
  html.verre #tabs{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 8px);border-radius:32px;padding:6px;border-top:1px solid var(--g-bord2)}
  html.verre #tabs button{border-radius:24px;min-height:54px;transition:background .25s var(--ease),color .2s}
  html.verre #tabs button.on{background:var(--g-fort);box-shadow:inset 0 1px 0 var(--g-reflet),0 4px 14px rgba(31,38,90,.14)}
  html.verre #fab{bottom:calc(env(safe-area-inset-bottom) + 90px);border-radius:50%}
  html.verre .composer{bottom:calc(env(safe-area-inset-bottom) + 82px)}
}

/* Boutons : capsules de verre */
html.verre :is(.btn,.ibtn,.seg,.chip,.pill,input,select,textarea,.av:not(.img)){
  background:var(--g-bg2);-webkit-backdrop-filter:var(--g-flou2);backdrop-filter:var(--g-flou2);
  border:1px solid var(--g-bord2);box-shadow:inset 0 1px 0 var(--g-reflet)
}
html.verre .btn{border-radius:999px}

  background:linear-gradient(135deg,rgba(99,102,241,.88),rgba(139,92,246,.82));border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(40,20,120,.25),0 8px 24px rgba(99,102,241,.35)}

html.verre input,html.verre select,html.verre textarea{border-radius:16px}

/* Bloc vedette « Que faire maintenant » : verre teinté */
html.verre .hero{background:linear-gradient(135deg,rgba(79,70,229,.82),rgba(124,58,237,.78) 60%,rgba(168,85,247,.74));
  border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 40px rgba(79,70,229,.32)}
html.verre .act{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);border-radius:20px}

/* Fenêtres et messages */
html.verre #modal{background:rgba(10,12,30,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

html.verre .gbox{background:transparent}

/* ===== 3.9 : en-tête net, réglages en listes groupées ===== */
#sbar{display:none}
#ptr{opacity:0;transition:transform .2s,opacity .15s}#ptr.on{opacity:1}
.chips{gap:8px}.chip .cn{opacity:.55;font-weight:600;margin-left:3px;font-variant-numeric:tabular-nums}

  #top,#top.scrolled{position:relative;padding:calc(env(safe-area-inset-top) + 16px) 16px 8px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none}
  #top h1{font-size:32px;font-weight:750;letter-spacing:-.03em}

  #sbar{display:block;position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 10px);z-index:9;pointer-events:none;background:linear-gradient(var(--bg) 55%,transparent)}

}

.reglages{max-width:680px;margin:0 auto}
.gh{font-size:13px;font-weight:600;color:var(--mu);margin:26px 16px 8px}
.grp{background:var(--s1);border:1px solid var(--bd);border-radius:18px;overflow:hidden;margin:0}
.grp.prof{margin-top:8px}
.grp.in{margin:12px 0}

.pdoc{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:18px 20px;font-size:14.5px;line-height:1.6;margin-bottom:6px;overflow-wrap:anywhere}
.pdoc .md h3{font-size:19px;line-height:1.3;margin:2px 0 10px;letter-spacing:-.01em}
.pdoc .md h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ac);margin:18px 0 6px;padding-top:14px;border-top:1px solid var(--bd)}
.pdoc .md h5{font-size:14.5px;margin:12px 0 4px}
.md li.ck{list-style:none;margin-left:-20px;padding-left:26px;position:relative}
.md li.ck::before{content:"";position:absolute;left:2px;top:5px;width:13px;height:13px;border:1.8px solid var(--mu);border-radius:4px}
.md li.ck.x::before{background:var(--ok);border-color:var(--ok)}
.faitrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--s1);border-radius:16px;padding:12px 14px;font:inherit;color:var(--tx);cursor:pointer;margin-bottom:10px;transition:background .2s,border-color .2s}
.faitrow .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s}
.faitrow .ck svg.i{width:16px;height:16px;stroke-width:3}
.faitrow.on{background:color-mix(in srgb,var(--ok) 10%,var(--s1));border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.faitrow.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.faitrow .ft{display:flex;flex-direction:column}.faitrow small{color:var(--mu);font-size:12.5px}
.pacts{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.pacts .btn.primary{flex:1}
.pacts .ibtn{width:44px;height:44px}
textarea.mono{font:13px/1.55 var(--mono);min-height:55vh}
/* Liste des prompts */
.plist{display:flex;flex-direction:column;gap:10px}
.pc{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);background:var(--s1);border-radius:18px;padding:12px 10px 12px 12px}
.pck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,var(--bd));background:none;color:transparent;display:grid;place-items:center;cursor:pointer;transition:all .2s;padding:0}
.pck svg.i{width:16px;height:16px;stroke-width:3}
@media (hover:hover){.pck:hover{color:color-mix(in srgb,var(--ok) 75%,transparent);border-color:var(--ok)}}
.pc.fait .pck{background:var(--ok);border-color:var(--ok);color:#fff}
.pcb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:none;text-align:left;color:var(--tx);font:inherit;cursor:pointer;padding:0}
.pct{font-weight:650;font-size:15px;line-height:1.3}
.pcx{font-size:13px;color:var(--tx2);line-height:1.45}
.pcm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin-top:3px}
.pc.fait .pct{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--tx) 30%,transparent);color:var(--tx2)}
.pc .ibtn{width:38px;height:38px}
/* Carte mentale */
.carte{background:var(--s1);border:1px solid var(--bd);border-radius:24px;padding:0 0 12px;margin:8px 0 14px;overflow:hidden}
.carte-svg{overflow-x:auto}
.mindmap{display:block;margin:0 auto;font-family:inherit}
.mnr{fill:var(--s1);stroke:var(--bd);stroke-width:1;transition:stroke .15s}
.mn{cursor:pointer}.mn:hover .mnr,.mn:focus .mnr{stroke:var(--ac);stroke-width:1.8}
.mn:focus{outline:none}
.mnt{fill:var(--tx);font-weight:560}
.mn.faite .mnt{fill:var(--mu);text-decoration:line-through}
.mtt{font-size:12px;font-weight:750}
.mc{cursor:pointer}.mct{fill:#fff;font-size:13.5px;font-weight:750}.mcs{fill:rgba(255,255,255,.85);font-size:11px;font-weight:600}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;padding:2px 16px 0;font-size:12px;color:var(--mu)}
.legende span{display:inline-flex;align-items:center;gap:6px}.legende i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legende i.pt{width:16px;height:0;border-radius:0;border-top:1.6px dashed var(--mu)}
.lecture .synth{line-height:1.6;margin:0 0 6px}
.ordre{margin:4px 0;padding-left:22px}.ordre li{margin:4px 0}
/* Formation du chef */
.form-h{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.form-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;flex:none;box-shadow:0 6px 18px rgba(56,189,248,.3)}
.form-ic svg.i{width:26px;height:26px}
.form-bar{height:6px;border-radius:6px;background:var(--s2);margin:0 0 10px;overflow:hidden}.form-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7)}
.fmod{border:1px solid var(--bd);border-radius:14px;margin:8px 0;background:var(--s1);overflow:hidden}
.fmod>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer}
.fmod>summary::-webkit-details-marker{display:none}
.fmi{width:36px;height:36px;border-radius:10px;background:var(--s2);display:grid;place-items:center;font-size:18px;flex:none}
.fmod .rgt{white-space:normal;font-weight:620;font-size:14.5px;line-height:1.3}
.fmod .rgt small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:400;font-size:12.5px;color:var(--mu);margin-top:2px}
.fmod[open] .rgt small{display:block}
.fmh{flex:none;font-size:12px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);padding:3px 8px;border-radius:8px}
.fmc{padding:4px 14px 12px;font-size:14px;border-top:1px solid var(--bd)}
.fmc .md h5{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 0 4px}
.fmc .md h3,.fmc .md h4{font-size:14px;margin:10px 0 4px}
/* Accueil : carte Idées */
.idtoday{cursor:pointer}
.idtoday .hd{margin-bottom:6px}
.idtoday .kv{display:flex;flex-wrap:wrap;gap:6px}
/* Verre */
html.verre :is(.idcomp,.idc,.pc,.carte,.pdoc,.faitrow,.fmod){background:var(--g-bg);-webkit-backdrop-filter:var(--g-flou);backdrop-filter:var(--g-flou);border-color:var(--g-bord2);box-shadow:inset 0 1px 0 var(--g-reflet),var(--g-ombre)}
html.verre .idc,html.verre .pc{border-radius:22px}
html.verre .carte{border-radius:28px}
html.verre .mnr{fill:var(--g-fort)}
html.verre .avis{background:linear-gradient(180deg,color-mix(in srgb,var(--v) 18%,transparent),transparent 75%),var(--g-bg);-webkit-backdrop-filter:var(--g-flou);backdrop-filter:var(--g-flou);border-color:color-mix(in srgb,var(--v) 35%,var(--g-bord2));box-shadow:inset 0 1px 0 var(--g-reflet),var(--g-ombre)}
html.verre .idnote,html.verre .prop{background:var(--g-bg2)}
html.verre .faitrow.on{background:color-mix(in srgb,var(--ok) 16%,transparent)}
html.verre .idcomp.open{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 14%,transparent),inset 0 1px 0 var(--g-reflet),var(--g-ombre)}

/* ===== 4.1 : mise en page adaptative (téléphone, tablette, PC, grand écran) ===== */
:root{--maxw:1180px}
@media (min-width:1600px){:root{--maxw:1440px}}
main{max-width:var(--maxw)}
#top,#top.scrolled,html.verre #top{position:relative;max-width:var(--maxw);width:100%;margin:0 auto}
.thd{top:calc(env(safe-area-inset-top) + 8px)}
@media (min-width:700px){
  .thd{top:12px}
  .dlist{top:16px;max-height:calc(100vh - 32px)}
  :root{--sidew:calc(256px + env(safe-area-inset-left))}
  body.rail{--sidew:calc(68px + env(safe-area-inset-left))}
  body.deplie{--sidew:calc(68px + env(safe-area-inset-left))}
  #side,html.verre #side{padding-left:calc(10px + env(safe-area-inset-left))}
  main{padding-right:calc(32px + env(safe-area-inset-right))}
  #top{padding-right:calc(32px + env(safe-area-inset-right))}
  /* panneau déplié par-dessus la page (tablette) */
  body.deplie #side,html.verre body.deplie #side{position:fixed;left:0;top:0;bottom:0;height:100%;width:calc(264px + env(safe-area-inset-left));z-index:31;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:glisse .22s var(--ease)}
  html.verre body.deplie #side{background:var(--g-fort)}
  body.deplie #sideVoile{display:block;position:fixed;inset:0;z-index:30;background:rgba(10,12,20,.32);animation:fade .2s}
}
#sideVoile{display:none}
@keyframes glisse{from{transform:translateX(-24px);opacity:.6}}
/* iPhone à l'horizontale et écrans peu hauts : barre d'icônes plus compacte */
@media (min-width:700px) and (max-height:560px){
  body.rail .sni{min-height:34px}
  body.rail .sbtop{gap:6px;padding-bottom:8px}
  body.rail .sgrp+.sgrp{margin-top:4px;padding-top:4px}
  #top{padding-top:12px;padding-bottom:6px}
  #top h1{font-size:24px}
  #modal.drawer .sheet{padding-top:4px}
}
/* survol absent (écran tactile) : rien de caché derrière un survol */
@media (hover:none){.sgadd{opacity:1}.sgh svg.i{opacity:.8}}
/* Accueil : deux colonnes dès que la place le permet */
@media (min-width:1000px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
/* Synchro : trois colonnes sur grand écran */
@media (min-width:1700px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* Idées et Réglages s'adaptent à la place dont ils disposent (requêtes de conteneur) */
.idees,.regw{container-type:inline-size}
@media (min-width:1600px){.idees{max-width:1240px}.idees.large{max-width:1440px}}
.idgroups{display:block}
@container (min-width:960px){
  .idgroups:not(.seul){display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:0 24px;align-items:start}
  .idgroups.seul .idl,.plist{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .idcomp{max-width:none}
}
@media (min-width:1100px){.regw{max-width:1080px;margin:0 auto}}
@container (min-width:900px){
  .reglages{max-width:none;columns:2;column-gap:28px}
  .reglages>.grp.prof,.reglages>.gp.c{column-span:all}
  .reglages>.gbloc{break-inside:avoid;padding-bottom:2px}
  .reglages>.gbloc .gh{margin-top:20px}
}
/* très petits téléphones */
@media (max-width:370px){
  #tabs button{font-size:9.5px}
  #top h1{font-size:28px}
  .seg button{font-size:12.5px;padding:8px 4px}
  .idseg button svg.i{display:none}
}

/* ===== 4.2 : formation en parcours ===== */
.fseg{display:flex;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.fseg button{flex:1 1 auto;white-space:nowrap;padding:6px 8px;font-size:12.5px}
.fparc{display:flex;flex-direction:column;gap:10px}
.fpc{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1px solid var(--bd);background:var(--s1);border-radius:18px;padding:14px;color:var(--tx);font:inherit;cursor:pointer}
.fpc .rgt{white-space:normal;line-height:1.35}.fpc b{font-size:15px}.fpc small{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.fpc .form-bar{display:block;margin:10px 0 0;height:5px}
.fpi{width:42px;height:42px;border-radius:13px;background:var(--s2);display:grid;place-items:center;font-size:22px;flex:none}
.fphead{display:flex;align-items:center;gap:12px;margin:0 0 6px}.fphead b{display:block;font-size:16px}.fphead small{color:var(--mu);font-size:12.5px}
html.verre .fpc{background:var(--g-bg);-webkit-backdrop-filter:var(--g-flou);backdrop-filter:var(--g-flou);border-color:var(--g-bord2);box-shadow:inset 0 1px 0 var(--g-reflet),var(--g-ombre)}
@media (prefers-reduced-transparency:reduce){html.verre :is(.card,.kpi,.trow,#side,#tabs,#modal .sheet){background:var(--g-fort)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function md(src, doc=false){

    if(/^\s*```/.test(l)){ if(inCode){ out += blocCode(code); code = ''; inCode = false; } else { close(); inCode = true; } continue; }
    if(inCode){ code += l + '\n'; continue; }
    let m;
    if((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; } const ck = m[1].match(/^\[( |x|X)\]\s+(.*)/); out += ck ? `<li class="ck ${ck[1] === ' ' ? '' : 'x'}">${inline(ck[2])}</li>` : `<li>${inline(m[1])}</li>`; continue; }

    if(l.trim()) out += `<p>${inline(l)}</p>`;
  }
  close(); if(inCode) out += blocCode(code);
  return `<div class="md">${out}</div>`;
}

async function gh(path, opts={}){
  const headers = ghHeaders(opts.body ? {'Content-Type':'application/json'} : null, path);
  const r = await fetch(API + path, {method:opts.method||'GET', headers, body:opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store'});
  if(r.status === 404 && opts.allow404) return null;
  if(!r.ok){
    let m = ''; try{ m = (await r.json()).message; }catch{}
    if(r.status === 401) m = 'token GitHub invalide ou expiré';
    if(r.status === 403 && /Resource not accessible/.test(m)) m = 'le token n\'a pas la permission pour ça';
    if(r.status === 404) m = 'introuvable, ou le token n\'a pas accès';
    const e = new Error(`GitHub ${r.status} : ${m}`); e.status = r.status; throw e;
  }

}
async function ghRaw(repo, path){

function resumeEtat(j){
  if(!j || typeof j !== 'object') return null;

async function recentDiffs(repo, n=5, maxChars=40000){

    let block = `\n### Commit ${c.sha.slice(0,7)} — ${c.commit.message.split('\n')[0]} (${c.commit.author?.date})\n`;

  shas:LS.get('atelier.cloud.shas', {}), joined:LS.get('atelier.cloud.joined', false),
  get repo(){ return L.cloud || 'oiriaure/atelier-donnees'; },
  get path(){ return `sync/${L.device}.json`; },
  on(){ return !!(L.ghToken && validRepo(this.repo)); },
  enqueue(job){ return (this.q = this.q.then(job, job)); },
  setJoined(){ this.joined = true; LS.set('atelier.cloud.joined', true); },
  snapshot(){
    const keys = Object.assign({}, SH);
    return JSON.stringify({v:1, device:L.device, platform:PLATEFORME, nom:L.nomAppareil || PLATEFORME, updated:Date.now(), version:VERSION, keys});
  },
  async push(){
    if(!this.on() || !this.joined) return;
    const body = {message:`Atelier depuis ${PLATEFORME}`, content:utf8b64(this.snapshot())};
    if(this.shas[this.path]) body.sha = this.shas[this.path];
    const url = `${API}/repos/${this.repo}/contents/${this.path}`;
    let r = await fetch(url, {method:'PUT', headers:ghHeaders({'Content-Type':'application/json'}), body:JSON.stringify(body)});
    for(let i = 0; i < 2 && (r.status === 409 || r.status === 422); i++){
      await sleep(500 + Math.random()*800);
      const g = await fetch(url + `?t=${Date.now()}`, {headers:ghHeaders(), cache:'no-store'});
      if(g.ok) body.sha = (await g.json()).sha; else delete body.sha;
      r = await fetch(url, {method:'PUT', headers:ghHeaders({'Content-Type':'application/json'}), body:JSON.stringify(body)});
    }
    if(r.status === 403 || r.status === 404) throw new Error('Le token ne peut pas écrire dans le cloud (' + this.repo + ')');
    if(!r.ok) throw new Error('envoi au cloud ' + r.status);
    this.shas[this.path] = (await r.json()).content.sha; LS.set('atelier.cloud.shas', this.shas);
    this.st.pushed = Date.now();
  },
  async pull(){
    if(!this.on()) return false;
    const h = ghHeaders(); if(this.etag) h['If-None-Match'] = this.etag;
    const r = await fetch(`${API}/repos/${this.repo}/git/ref/heads/main`, {headers:h, cache:'no-store'});
    if(r.status === 304) return false;
    if(r.status === 409){ this.st.repoOk = true; if(!this.joined){ this.setJoined(); this.schedule(true); } return false; }   // dépôt encore vide
    if(r.status === 404){
      const rep = await fetch(`${API}/repos/${this.repo}`, {headers:ghHeaders(), cache:'no-store'});
      if(rep.ok){ this.st.repoOk = true; if(!this.joined){ this.setJoined(); this.schedule(true); } return false; }
      throw new Error('Le token n\'a pas accès au cloud (' + this.repo + ')');
    }
    if(!r.ok) throw new Error('lecture du cloud ' + r.status);
    this.st.repoOk = true;
    this.etag = r.headers.get('ETag');
    const sha = (await r.json()).object.sha;
    if(sha === this.head) return false;
    const t = await fetch(`${API}/repos/${this.repo}/git/trees/${sha}?recursive=1`, {headers:ghHeaders(), cache:'no-store'});
    if(!t.ok && t.status !== 404) throw new Error('lecture du cloud ' + t.status);
    let changed = false;
    for(const f of (t.ok ? (await t.json()).tree : []) || []){   // 404 = arbre vide (dépôt sans fichier)
      const m = f.type === 'blob' && f.path.match(/^sync\/([A-Za-z0-9_-]+)\.json$/); if(!m) continue;
      const dev = m[1];
      if(dev === L.device){ this.shas[f.path] = f.sha; continue; }
      if(C.remote[dev]?.sha === f.sha) continue;
      const g = await fetch(`${API}/repos/${this.repo}/git/blobs/${f.sha}`, {headers:ghHeaders(), cache:'force-cache'});
      if(!g.ok) continue;
      let data; try{ data = JSON.parse(b64utf8((await g.json()).content)); }catch{ continue; }
      C.remote[dev] = {sha:f.sha, platform:data.platform, nom:data.nom, updated:data.updated, version:data.version};
      for(const [k, e] of Object.entries(data.keys||{})){ if(e && e.t > (SH[k]?.t || 0)){ SH[k] = e; changed = true; } }
    }
    this.head = sha;
    LS.set('atelier.cloud.shas', this.shas); saveC();
    if(!this.joined){ this.setJoined(); this.schedule(true); }
    if(changed){ saveSH(); await adopterCles(); }
    return changed;
  },
  schedule(soon=false){
    if(!this.on()) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.enqueue(async () => { try{ await this.push(); this.st.ok = true; this.st.err = null; }catch(e){ this.st.ok = false; this.st.err = e.message; } renderChrome(); }), soon ? 200 : 1500);
  },
  tick(force=false){
    if(!this.on() || this.st.busy) return;
    this.st.busy = true;
    return this.enqueue(async () => {
      try{
        if(force){ this.etag = null; this.head = null; }
        const changed = await this.pull();
        this.st.ok = true; this.st.err = null; this.st.last = Date.now();
        if(this.joined && !REG().atelierAjoute) ajouterAtelier();
        if(changed){ if(view === 'idees' && enSaisie()) IDV.sale = true; else render(); if(IDSHEET && !IDSHEET.edit && !$('#modal').hidden && /^(idee|prompt)$/.test(IDSHEET.type) && !enSaisie()) rouvrirSheet(); if(!force) toast('Mis à jour depuis un autre appareil'); }
      }catch(e){ this.st.ok = false; this.st.err = !navigator.onLine ? 'hors ligne' : e.message; }
      finally{ this.st.busy = false; renderChrome(); }
    });
  },
  start(){
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), document.hidden ? 20000 : 5000);
    this.tick();
  }
};
document.addEventListener('visibilitychange', () => { if(L.ghToken){ Cloud.start(); } });
async function cleAES(){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(L.ghToken), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:new TextEncoder().encode('atelier-cles-v1'), iterations:120000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function chiffrer(txt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await cleAES(), new TextEncoder().encode(txt)));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return btoa(String.fromCharCode(...all));
}
async function dechiffrer(b){ const all = Uint8Array.from(atob(b), x => x.charCodeAt(0)); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:all.slice(0,12)}, await cleAES(), all.slice(12))); }
async function partagerCle(){
  if(!L.ghToken || !window.crypto?.subtle) return;
  try{
    const v = {};
    if(L.geminiKey) v.g = await chiffrer(L.geminiKey);
    v.c = L.claudeKey ? await chiffrer(L.claudeKey) : null;
    v.j = await chiffrer(JSON.stringify(L.jetons||[]));
    put('cles', v);
  }catch(e){ console.warn(e); }
}
async function adopterCles(){
  const c = get('cles', null); if(!c || !L.ghToken || !window.crypto?.subtle) return;
  try{ if(c.g){ const k = await dechiffrer(c.g); if(k && k !== L.geminiKey){ L.geminiKey = k; saveL(); } } }catch{}
  try{ if(c.c){ const k = await dechiffrer(c.c); if(k && k !== L.claudeKey){ L.claudeKey = k; saveL(); } } }catch{}
  try{ if(c.j){ const j = JSON.parse(await dechiffrer(c.j)); if(Array.isArray(j) && JSON.stringify(j) !== JSON.stringify(L.jetons||[])){ L.jetons = j; saveL(); } } }catch{}
}

/* ================================================================
   Gemini : sans longue réflexion, réponses en flux, modèles de secours
================================================================ */
const GEM = 'https://generativelanguage.googleapis.com/v1beta';
function gemErr(status, d){
  const m = d?.error?.message || '';
  if(status === 429) return 'Trop de demandes à Gemini, réessaie dans une minute';
  if(status === 400 && /API key/i.test(m)){ C.gemErr = {msg:'Clé Gemini refusée : vérifie-la dans les Réglages', at:Date.now(), cle:(L.geminiKey||'').slice(-6)}; saveC(); return C.gemErr.msg; }
  let t;
  if(/suspended/i.test(m)) t = 'Google a suspendu le projet de ta clé Gemini : elle ne marche plus. Crée une nouvelle clé (voir Synchro › Chef de projet)';
  else if(status === 403) t = 'Clé Gemini refusée : ' + m;
  else return `Gemini ${status} ${m}`.trim();
  C.gemErr = {msg:t, at:Date.now(), cle:(L.geminiKey||'').slice(-6)}; saveC();
  return t;
}
async function listModels(force=false){
  if(!force && C.models?.length && Date.now() - (C.modelsAt||0) < 864e5) return C.models;
  const r = await fetch(GEM + '/models?pageSize=200', {headers:{'x-goog-api-key':L.geminiKey}});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(gemErr(r.status, d));
  C.models = (d.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent')).map(m => m.name.replace(/^models\//,''));
  C.modelsAt = Date.now(); saveC();
  return C.models;
}
function classer(list){
  const P = n => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)-(flash|pro)(-lite)?(.*)$/); if(!m || m[2] === 'pro') return null;
    if(/tts|image|live|audio|embed|thinking|exp|computer|native/i.test(m[4])) return null;
    return {n, v:parseFloat(m[1]), lite:!!m[3], pre:/preview/.test(m[4]), alias:/latest/.test(m[4])}; };
  const all = (list||[]).map(P).filter(Boolean).sort((a, b) => (a.pre - b.pre) || (b.v - a.v) || (a.alias - b.alias) || a.n.length - b.n.length);
  return {flash:all.filter(x => !x.lite).map(x => x.n).slice(0,3), lite:all.filter(x => x.lite).map(x => x.n).slice(0,3)};
}
async function modelChain(tier){
  const reg = REG();
  if(reg.model && reg.model !== 'auto') return [reg.model.replace(/^models\//,'')];
  let c = {flash:[], lite:[]};
  try{ c = classer(await listModels()); }catch{}
  if(!c.flash.length && !c.lite.length) c = {flash:['gemini-2.5-flash'], lite:['gemini-2.5-flash-lite']};
  const rapide = reg.vitesse === 'rapide' || (tier === 'rapide' && reg.vitesse !== 'approfondi');
  const list = rapide ? [...c.lite, ...c.flash] : [...c.flash, ...c.lite];
  const ok = list.filter(m => C.blocked?.[m] !== today());
  return ok.length ? ok : list;
}
function reflexion(m, pense=false){
  if(C.noThink?.[m]) return null;
  const deep = pense || REG().vitesse === 'approfondi';
  if(/^gemini-2\.5-flash-lite/.test(m)) return deep ? {thinkingBudget:512} : null;
  if(/^gemini-2\.5-flash/.test(m)) return {thinkingBudget:deep ? 2048 : 0};
  if(/^gemini-([3-9]|\d\d)/.test(m)) return {thinkingLevel:deep ? 'low' : 'minimal'};
  return null;
}
/* Garde-fous (3.5) : la clé peut être payante. Plafond d'appels par jour et par appareil, rythme limité,
   et aucune clé ni aucun token n'est jamais envoyé à Gemini. */
const SECRETS = /github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|AIza[0-9A-Za-z_-]{30,}|AQ\.[A-Za-z0-9_-]{30,}|sk[-]ant[-][A-Za-z0-9_-]{20,}/g;
const masquer = t => typeof t === 'string' ? t.replace(SECRETS, '[clé masquée]') : t;
const plafondJour = () => Math.max(10, +get('reglages', {}).plafondJour || 150);
function appelsJour(){ const j = today(); if(C.gemJour?.j !== j) C.gemJour = {j, n:0}; return C.gemJour; }
async function garde(){
  const a = appelsJour();
  if(a.n >= plafondJour()) throw new Error(`Limite de sécurité atteinte : ${a.n} appels Gemini aujourd'hui sur cet appareil (réglable dans Réglages › Intelligence)`);
  C.gemMin = (C.gemMin || []).filter(t => Date.now() - t < 60e3);
  if(C.gemMin.length >= 12) await sleep(60e3 - (Date.now() - C.gemMin[0]) + 200);
  C.gemMin.push(Date.now()); a.n++; saveC();
}
async function gemini(input, {json=false, system=null, temperature=0.5, tier='fort', onText=null, signal=null, pense=false}={}){
  if(!L.geminiKey) throw new Error('Ajoute ta clé Gemini dans les Réglages');
  const contents = (typeof input === 'string' ? [{role:'user', parts:[{text:input}]}] : input).map(c => ({...c, parts:c.parts.map(p => p.text != null ? {...p, text:masquer(p.text)} : p)}));
  if(system && system.startsWith('Tu es le chef de projet')) system += leconsTexte();
  system = masquer(system);
  let last = null;
  for(const m of await modelChain(tier)){
    for(let essai = 0; essai < 2; essai++){
      const body = {contents, generationConfig:{temperature}};
      const th = reflexion(m, pense); if(th) body.generationConfig.thinkingConfig = th;
      if(system) body.systemInstruction = {parts:[{text:system}]};
      if(json) body.generationConfig.responseMimeType = 'application/json';
      const enFlux = !!onText && !json;
      let r;
      await garde();
      try{
        r = await fetch(`${GEM}/models/${encodeURIComponent(m)}:${enFlux ? 'streamGenerateContent?alt=sse' : 'generateContent'}`, {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':L.geminiKey}, body:JSON.stringify(body), signal});
      }catch(e){ if(e.name === 'AbortError') throw e; throw new Error('Pas de réseau pour joindre Gemini'); }
      if(!r.ok){
        const d = await r.json().catch(() => ({}));
        last = new Error(gemErr(r.status, d));
        if(r.status === 400 && th && /think/i.test(d?.error?.message||'')){ C.noThink[m] = true; saveC(); continue; }
        if(r.status === 429){ if(/day|PerDay|daily/i.test(JSON.stringify(d))){ C.blocked[m] = today(); saveC(); } break; }
        if([404, 500, 503].includes(r.status)) break;
        throw last;
      }
      let text = '';
      if(enFlux){
        const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
        for(;;){
          const {done, value} = await reader.read(); if(done) break;
          buf += dec.decode(value, {stream:true});
          let i;
          while((i = buf.indexOf('\n')) >= 0){
            const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
            if(!line.startsWith('data:')) continue;
            try{ const d = JSON.parse(line.slice(5)); const t = (d.candidates?.[0]?.content?.parts||[]).filter(p => !p.thought).map(p => p.text||'').join(''); if(t){ text += t; onText(text); } }catch{}
          }
        }
      } else {
        const d = await r.json().catch(() => ({}));
        text = (d.candidates?.[0]?.content?.parts||[]).filter(p => !p.thought).map(p => p.text||'').join('');
      }
      text = text.trim();
      if(!text){ last = new Error('Réponse vide de Gemini'); break; }
      C.lastModel = m; C.gemErr = null; saveC();
      return json ? parseJSON(text) : text;
    }
  }
  throw last || new Error('Aucun modèle Gemini disponible');
}

/* ================================================================
   Chef premium (4.3) : Claude seulement pour les gros projets et les prompts complexes.
   Le chef décide seul (complexite) ; plafond mensuel en euros ; sans clé, hors ligne ou plafond atteint → Gemini.
   Leçons : ce que Clément dit d'un prompt terminé devient une règle relue à chaque travail du chef.
================================================================ */
const CLAUDE_API = 'https://api.anthropic.com/v1';
const claudeHdr = () => ({'x-api-key':L.claudeKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true', 'content-type':'application/json'});
const PRIX_CLAUDE = {in:3, cw:3.75, cr:0.3, out:15};   // dollars par million de jetons (gamme Sonnet)
const EUR_PAR_USD = 0.95;                              // prudent
const eur2 = n => (+n || 0).toFixed(2).replace('.', ',') + ' €';
const budgetPremium = () => { const v = parseFloat(String(get('reglages', {}).budgetPremium || '').replace(',', '.')); return v >= 1 && v <= 200 ? v : 5; };
function premiumMois(){ const m = today().slice(0, 7), d = get('premium', null); return d && d.mois === m ? d : {mois:m, eur:0, n:0, hist:[]}; }
const premiumDispo = () => !!L.claudeKey && navigator.onLine && premiumMois().eur < budgetPremium();
function premiumNote(eur, quoi, modele){
  const d = Object.assign({}, premiumMois());
  d.eur = +((d.eur || 0) + eur).toFixed(4); d.n = (d.n || 0) + 1;
  d.hist = [{t:Date.now(), eur:+eur.toFixed(4), quoi, modele}, ...(d.hist || [])].slice(0, 30);
  put('premium', d);
}
let CLAUDE_LAST = {eur:0, modele:''};
function claudeErr(status, d){
  const m = d?.error?.message || '';
  if(status === 401) return 'Clé Claude refusée : vérifie-la dans les Réglages';
  if(status === 400 && /credit/i.test(m)) return 'Crédit Claude épuisé : recharge le compte sur la console Anthropic';
  if(status === 403) return 'Accès Claude refusé : ' + m.slice(0, 90);
  if(status === 429 || status === 529) return 'Claude est saturé en ce moment, réessaie dans une minute';
  return 'Claude : ' + (m || 'erreur ' + status).slice(0, 120);
}
async function claudeModele(){
  if(C.claudeModel && C.claudeModelAt === today()) return C.claudeModel;
  let m = 'claude-sonnet-5-5';
  try{
    const r = await fetch(CLAUDE_API + '/models?limit=100', {headers:claudeHdr()});
    if(r.status === 401) throw new Error(claudeErr(401));
    if(r.ok){ const d = await r.json(); const x = (d.data || []).map(i => i.id).find(i => /sonnet/i.test(i)); if(x) m = x; }
  }catch(e){ if(/refusée/.test(e.message)) throw e; }
  C.claudeModel = m; C.claudeModelAt = today(); saveC(); return m;
}
// input : texte, ou liste de messages {role, content}. Le système et le premier message sont mis en cache (relecture à 10 % du prix).
async function claude(input, {system='', max=8000, temperature=0.4, onText=null, signal=null, quoi='prompt'}={}){
  if(!L.claudeKey) throw new Error('Ajoute ta clé Claude dans les Réglages');
  const modele = await claudeModele();
  const msgs = (typeof input === 'string' ? [{role:'user', content:input}] : input).map((x, i) => ({role:x.role, content:[Object.assign({type:'text', text:masquer(x.content)}, i === 0 ? {cache_control:{type:'ephemeral'}} : {})]}));
  const body = {model:modele, max_tokens:max, temperature, stream:!!onText, messages:msgs,
    system:[{type:'text', text:masquer(system), cache_control:{type:'ephemeral'}}].concat(leconsTexte() ? [{type:'text', text:masquer(leconsTexte())}] : [])};
  let r;
  for(let essai = 0; essai < 2; essai++){
    try{ r = await fetch(CLAUDE_API + '/messages', {method:'POST', headers:claudeHdr(), body:JSON.stringify(body), signal}); }
    catch(e){ if(e.name === 'AbortError') throw e; throw new Error('Pas de réseau pour joindre Claude'); }
    if(r.ok) break;
    const d = await r.json().catch(() => ({}));
    if(r.status === 400 && /temperature/i.test(JSON.stringify(d)) && 'temperature' in body){ delete body.temperature; continue; }
    throw new Error(claudeErr(r.status, d));
  }
  const u = {in:0, cw:0, cr:0, out:0}; let text = '';
  const compte = x => { if(!x) return; if(x.input_tokens != null) u.in = x.input_tokens; if(x.cache_creation_input_tokens != null) u.cw = x.cache_creation_input_tokens; if(x.cache_read_input_tokens != null) u.cr = x.cache_read_input_tokens; if(x.output_tokens != null) u.out = x.output_tokens; };
  if(body.stream){
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for(;;){
      const {done, value} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if(!line.startsWith('data:')) continue;
        try{
          const d = JSON.parse(line.slice(5));
          if(d.type === 'message_start') compte(d.message?.usage);
          else if(d.type === 'message_delta') compte(d.usage);
          else if(d.type === 'content_block_delta' && d.delta?.type === 'text_delta'){ text += d.delta.text; onText(text); }
          else if(d.type === 'error') throw new Error(claudeErr(529, d));
        }catch(e){ if(/Claude/.test(e.message)) throw e; }
      }
    }
  } else {
    const d = await r.json().catch(() => ({}));
    compte(d.usage); text = (d.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  }
  const eur = (u.in * PRIX_CLAUDE.in + u.cw * PRIX_CLAUDE.cw + u.cr * PRIX_CLAUDE.cr + u.out * PRIX_CLAUDE.out) / 1e6 * EUR_PAR_USD;
  CLAUDE_LAST = {eur, modele};
  premiumNote(eur, quoi, modele);
  text = text.trim();
  if(!text) throw new Error('Réponse vide de Claude');
  return text;
}

// Le chef décide seul s'il vaut la peine d'utiliser le modèle puissant (et paie) : un gros projet ou un prompt qui touche des points délicats.
function complexite(choisies, precision=''){
  let s = 0; const r = [];
  const n = choisies.length;
  if(n >= 3){ s += 3; r.push(n + ' idées à relier'); } else if(n === 2){ s += 1; r.push('2 idées liées'); }
  if(choisies.some(x => /gros/i.test(x.avis?.effort || ''))){ s += 3; r.push('effort estimé important'); }
  else if(choisies.some(x => /moyen/i.test(x.avis?.effort || '') && /fort/i.test(x.avis?.impact || ''))){ s += 1; }
  const t = choisies.map(x => `${titreIdee(x)} ${x.texte} ${x.avis?.amelioration || ''}`).join(' ') + ' ' + precision;
  if(/refonte|migrat|architect|synchro|s[ée]curit|chiffr|base de donn|nouvelle app|reconstru|r[ée][ée]cri|authentif|paiement|temps r[ée]el|multi-?appareil|hors[- ]ligne|mise [àa] jour automatique|backtest|moteur/i.test(t)){ s += 2; r.push('sujet délicat (données, synchro, sécurité ou moteur)'); }
  if(t.length > 1200){ s += 1; r.push('notes longues'); }
  if(precision.length > 250){ s += 1; r.push('précision détaillée'); }
  return {score:s, premium:s >= 3, raisons:r};
}

// Leçons (4.3)
const lecons = () => get('lecons', {l:[]}).l || [];
function leconsTexte(){
  const l = lecons().slice(0, 12);

}
const RELECTURE = `Relis maintenant ton prompt en relecteur critique et sévère, avec le cerveau de l'app sous les yeux. Corrige : fichiers ou fonctions cités qui n'existent pas dans le cerveau (retire-les ou écris-les comme hypothèse à vérifier) ; critères d'acceptation vagues ou invérifiables ; étapes dans le mauvais ordre ; oublis (augmenter la version, publier, CLAUDE.md, version téléphone si l'app en a une) ; hors périmètre flou. Ne rallonge pas pour rien. Réponds uniquement par le prompt complet corrigé (même format, première ligne « # Titre »), sans commentaire.`;
const RETOURS = {parfait:'Parfait, rien à corriger', retouches:'Il a fallu retoucher', rate:'Raté ou à refaire'};
async function apprendre(p, v, note){
  p.retour = {v, note, at:Date.now()}; promptPut(p);
  if(!note || !L.geminiKey || !navigator.onLine) return;
  try{
    const t = await gemini(`Un prompt rédigé par le chef pour ${appBy(p.app).name} (« ${p.titre} ») a donné ce résultat : ${RETOURS[v]}.\nRetour de Clément : « ${note} »\n\nFormule UNE règle de travail, courte (25 mots maximum), générale et réutilisable, que le chef appliquera à ses prochains prompts et avis. Réponds uniquement par la règle, sans guillemets.`, {tier:'rapide', temperature:0.2});
    const r = txt(t).replace(/^["«\s-]+|["»\s]+$/g, '').slice(0, 220); if(!r) return;
    const d = Object.assign({}, get('lecons', {l:[]}));
    d.l = [{id:nouvelId(), t:Date.now(), app:p.app, texte:`[${appBy(p.app).name}] ${r}`, v}, ...(d.l || [])].slice(0, 30);
    put('lecons', d);
  }catch(e){ console.warn('leçon', e.message); }
}
