<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier — mes projets</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atelier">
<style>
:root{
  --bg:#f5f6f8;--bg2:#fff;--bg3:#eceef2;--tx:#14161b;--mu:#6b7280;--bd:#e2e5ea;
  --ac:#5b5bf0;--ac2:#ececff;--ok:#16a34a;--wa:#d97706;--ko:#dc2626;--gr:#9ca3af;
  --r:16px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--bg2:#171a21;--bg3:#20242d;--tx:#eef0f4;--mu:#9aa1ad;--bd:#2a2f3a;
  --ac:#8b8bff;--ac2:#25264a;--sh:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac);text-decoration:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:34px;height:34px;border-radius:9px}
h1{font-size:19px;margin:0;line-height:1.1}
#lastsync{color:var(--mu);font-size:12px}
main{max-width:760px;margin:0 auto;padding:4px 16px calc(env(safe-area-inset-bottom) + 110px)}
.icon{border:0;background:var(--bg3);color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;flex:none}
.icon.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);background:var(--bg2);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--ac);font-weight:600}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:7;width:56px;height:56px;border-radius:18px;border:0;
  background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(91,91,240,.4);cursor:pointer}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:18px}
.muted{color:var(--mu)} .sm{font-size:12px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 4px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.stats div{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--mu)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--bg3);color:var(--tx);display:inline-block}
.btn.primary{background:var(--ac);color:#fff}
.btn.sm{padding:7px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.6}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;color:var(--tx)}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.em{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
.app{cursor:pointer;margin:0}
.app .top{display:flex;align-items:center;gap:10px}
.app .em{font-size:28px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.green{background:var(--ok)}.orange{background:var(--wa)}.red{background:var(--ko)}.grey{background:var(--gr)}
.pill{display:inline-block;background:var(--bg3);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.action{border-left:4px solid var(--ac);background:var(--bg3);border-radius:12px;padding:12px;margin-top:10px}
.action h4{margin:0 0 4px;font-size:15px}
.err{color:var(--ko);font-size:13px}
.ok{color:var(--ok)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--tx)} .chk input{width:auto;margin-top:4px}
.appedit{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}
.approw{display:grid;grid-template-columns:52px 1fr 1.4fr 40px;gap:6px;margin-top:6px}
.approw2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.approw input,.approw2 input{padding:9px 8px;font-size:14px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg2);width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
@media (min-width:800px){#modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 6px;padding-right:44px}
.sheet .close{float:right}
pre,.pre{white-space:pre-wrap;word-break:break-word;background:var(--bg3);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;max-height:50vh;overflow:auto}
details{margin-top:10px} summary{cursor:pointer;color:var(--mu)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 140px);z-index:30;
  background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
#toast.bad{background:var(--ko);color:#fff}
.empty{text-align:center;padding:40px 16px}
.md p{margin:6px 0}.md h4{margin:14px 0 4px;font-size:15px}.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:3px 0}
.md code{background:var(--bg3);border-radius:5px;padding:1px 5px;font-size:13px}
.live{border-left:4px solid var(--ok)}
.live .t{font-weight:600}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.msg{max-width:92%;padding:10px 13px;border-radius:16px}
.msg.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.m{align-self:flex-start;background:var(--bg2);border:1px solid var(--bd);border-bottom-left-radius:4px}
.msg .btns{margin-top:6px}
.composer{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 70px);display:flex;gap:8px;margin-top:12px;background:var(--bg);padding:8px 0}
.composer textarea{min-height:46px;max-height:140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:6px}
.chips .btn{white-space:nowrap}
.qr{background:#fff;border-radius:14px;padding:12px;width:min(260px,70vw);margin:10px auto}
.qr svg{display:block;width:100%;height:auto}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}

/* ===== Adaptation téléphone (2.1) ===== */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,nav,.btn,.chips{-webkit-user-select:none;user-select:none;touch-action:manipulation}
header{padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--bd)}
.brand img{width:28px;height:28px;border-radius:8px}
h1{font-size:24px;letter-spacing:-.02em}
main{padding:2px 14px calc(env(safe-area-inset-bottom) + 150px)}
.card{padding:14px;margin:10px 0;border-radius:18px}
.card h2{font-size:17px}
.sec{margin:20px 4px 8px;font-size:12px}
.stats{gap:8px}
.stats div{padding:9px 6px;border-radius:14px}
.stats b{font-size:20px}
.stats span{font-size:11px}
.btn{min-height:44px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px}
.btns{gap:8px}
.ibtn{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--bg3);color:var(--tx);font-size:17px;display:grid;place-items:center;cursor:pointer}
input,select,textarea,.approw input,.approw2 input{font-size:16px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* Navigation */
nav{padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{font-size:10.5px;gap:3px;padding:6px 0 4px;min-height:50px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke-width:2.2}
nav .badge{position:absolute;margin-left:18px;margin-top:-4px;background:var(--ko);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-weight:700}
nav button{position:relative}
#fab{width:54px;height:54px;border-radius:17px;font-size:28px;bottom:calc(env(safe-area-inset-bottom) + 74px);transition:transform .25s,opacity .25s}
#fab.hide{transform:translateY(120px);opacity:0}
/* Aujourd'hui */
.hero{background:linear-gradient(135deg,var(--ac),#7c5cf0);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .btn.primary{background:#fff;color:#3b3bd0}
.hero .action{background:rgba(255,255,255,.14);border-left-color:#fff}
.hero .action .muted{color:rgba(255,255,255,.8)}
.hero .action .btn{background:rgba(255,255,255,.2);color:#fff}
.live{padding:12px 14px}
.live .t{font-size:15px}
/* Apps en liste */
.alist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.arow{display:flex;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer}
.arow:active,.row:active{transform:scale(.99)}
.arow .em{font-size:30px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg3);border-radius:12px;flex:none}
.arow .mid{flex:1;min-width:0}
.arow .nm{font-weight:650;display:flex;gap:6px;align-items:baseline}
.arow .nm small{color:var(--mu);font-weight:400;font-size:12px}
.arow .chev{color:var(--mu);font-size:20px}
/* Tâches */
.trow{display:flex;gap:8px;align-items:flex-start;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:10px 10px 10px 14px}
.trow .tt{flex:1;min-width:0;padding-top:9px;font-size:15px;line-height:1.35}
.trow .tt a{font-size:12px}
.trow .acts{display:flex;gap:6px}
/* Feuilles (modales) */
.sheet{padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:calc(100dvh - env(safe-area-inset-top) - 24px);overscroll-behavior:contain;transition:transform .2s}
.grab{position:sticky;top:-8px;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:-8px -16px 4px;padding:8px 12px 6px 16px;background:var(--bg2);touch-action:none}
.grab::before{content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);width:38px;height:5px;border-radius:3px;background:var(--bd)}
.grab .close{float:none;width:34px;height:34px;font-size:15px;margin-top:8px}
.sheet h2{font-size:21px;padding-right:0}
#modal{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%)}}
/* Chef */
body.chef main{padding-bottom:calc(env(safe-area-inset-bottom) + 150px)}
.composer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:6;margin:0;padding:8px 12px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd)}
.composer textarea{border-radius:20px;padding:11px 16px;min-height:44px;max-height:120px}
.composer .send{width:44px;height:44px;border-radius:22px;background:var(--ac);color:#fff;border:0;font-size:20px;flex:none}
.chips{margin:8px -14px 0;padding:0 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.msg{font-size:15px}
/* Réglages */
.approw{grid-template-columns:52px 1fr 44px}
.approw .repo{grid-column:1 / -1}
@media (min-width:600px){.approw{grid-template-columns:52px 1fr 1.4fr 44px}.approw .repo{grid-column:auto}}
@media (max-width:420px){.approw2{grid-template-columns:1fr}}
/* Tirer pour actualiser */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 54px);z-index:4;transform:translate(-50%,-60px);width:36px;height:36px;border-radius:18px;background:var(--bg2);border:1px solid var(--bd);display:grid;place-items:center;font-size:18px;color:var(--ac);transition:transform .2s;box-shadow:var(--sh)}
#toast{bottom:auto;top:calc(env(safe-area-inset-top) + 64px);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <button data-go="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>

</nav>
<div id="modal" hidden><div class="sheet"></div></div>
<div id="toast" hidden></div>
<div id="ptr" aria-hidden="true">⟳</div>
<script src="lib/qrcode.js"></script>
<script>
"use strict";
const VERSION = '2.1.0';
/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn('stockage plein', e); } }
};
const rtf = new Intl.RelativeTimeFormat('fr', {numeric:'auto'});
function ago(d){
  if(!d) return '';
  const s = (new Date(d) - Date.now())/1000, a = Math.abs(s);
  if(a < 60) return "à l'instant";
  if(a < 3600) return rtf.format(Math.round(s/60), 'minute');
  if(a < 86400) return rtf.format(Math.round(s/3600), 'hour');
  if(a < 86400*30) return rtf.format(Math.round(s/86400), 'day');
  return rtf.format(Math.round(s/(86400*30)), 'month');
}
const dateFR = d => new Date(d).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
let toastT;
function toast(msg, bad=false){
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 2600);
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); }
  catch{ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copié ✓');
}
function parseJSON(t){
  try{ return JSON.parse(t); }
  catch{ const m = String(t).match(/[\[{][\s\S]*[\]}]/); if(m) return JSON.parse(m[0]); throw new Error('Réponse JSON illisible'); }
}
const normRepo = r => (r||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/^\/+|\/+$/g,'');
const validRepo = r => /^[\w.-]+\/[\w.-]+$/.test(r);
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
function b64utf8(b64){ const bin = atob(b64.replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function utf8b64(s){ const b = new TextEncoder().encode(s); let bin = ''; for(let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode(...b.subarray(i, i+0x8000)); return btoa(bin); }
const b64url = s => utf8b64(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url = s => b64utf8(s.replace(/-/g,'+').replace(/_/g,'/'));
const clip = (s, n) => { s = String(s||''); return s.length > n ? s.slice(0, n) + '\n[…coupé]' : s; };

/* Markdown minimal et sûr (on échappe d'abord) */
function md(src){
  const inline = s => s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  let out = '', list = null, inCode = false, code = '';
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for(const l of esc(src).split('\n')){
    if(/^\s*```/.test(l)){ if(inCode){ out += `<pre>${code}</pre>`; code = ''; inCode = false; } else { close(); inCode = true; } continue; }
    if(inCode){ code += l + '\n'; continue; }
    let m;
    if((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list !== 'ol'){ close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    close();
    if((m = l.match(/^#{1,6}\s+(.*)/))){ out += `<h4>${inline(m[1])}</h4>`; continue; }
    if(l.trim()) out += `<p>${inline(l)}</p>`;
  }
  close(); if(inCode) out += `<pre>${code}</pre>`;
  return `<div class="md">${out}</div>`;
}

const API = 'https://api.github.com';
function ghHeaders(extra){ const h = {'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(S.ghToken) h.Authorization = 'Bearer ' + S.ghToken; return Object.assign(h, extra||{}); }
async function gh(path, opts={}){
  const headers = ghHeaders(opts.body ? {'Content-Type':'application/json'} : null);
  const r = await fetch(API + path, {method:opts.method||'GET', headers, body:opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store'});
  if(r.status === 404 && opts.allow404) return null;
  if(!r.ok){
    let m = ''; try{ m = (await r.json()).message; }catch{}
    if(r.status === 401) m = 'token GitHub invalide ou expiré';
    if(r.status === 403 && /Resource not accessible/.test(m)) m = 'le token n\'a pas la permission pour ça (voir Réglages)';
    if(r.status === 404) m = 'introuvable, ou le token n\'a pas accès à ce dépôt';
    throw new Error(`GitHub ${r.status} : ${m}`);
  }
  return r.status === 204 ? null : r.json();
}
async function ghRaw(repo, path){
  const r = await fetch(`${API}/repos/${repo}/contents/${encPath(path)}`, {headers:ghHeaders({'Accept':'application/vnd.github.raw+json'}), cache:'no-store'});
  if(r.status === 404) return null;
  if(!r.ok) throw new Error(`GitHub ${r.status} sur ${repo}/${path}`);
  return r.text();
}
const mapIssue = i => ({number:i.number, title:i.title, body:(i.body||'').slice(0,2000), url:i.html_url, labels:(i.labels||[]).map(l => l.name||l), created:i.created_at});
const BRAINS = ['CLAUDE.md', 'CERVEAU.md', 'AGENTS.md'];
async function readBrain(repo){
  for(const p of BRAINS){ const t = await ghRaw(repo, p).catch(() => null); if(t != null) return {path:p, text:t}; }

}
function resumeEtat(j){
  if(!j || typeof j !== 'object') return null;
  const s = {t:j.envoi || j.t || j.date || null};
  if(j.climat) s.climat = {titre:j.climat.titre, resume:clip(j.climat.resume, 500)};

  if(j.risque) s.risque = j.risque;
  const byT = arr => arr.slice().sort((x, y) => (y.t||0) - (x.t||0));
  if(Array.isArray(j.alertes)) s.alertes = byT(j.alertes).slice(0,3).map(x => ({t:x.t, texte:x.texte}));
  if(Array.isArray(j.bureau)) s.bureau = byT(j.bureau).slice(0,5).map(x => ({t:x.t, de:x.de, texte:x.texte}));

    gh(`/repos/${repo}/commits?per_page=10`).catch(() => []),

    validRepo(a.donnees) && a.etat ? ghRaw(a.donnees, a.etat).catch(e => JSON.stringify({__err:e.message})) : null
  ]);
  let version = null, projet = null, live = null, liveErr = null;
  try{ if(verTxt){ const v = JSON.parse(verTxt); version = {version:v.version, date:v.date, notes:(v.notes||[]).slice(0,8)}; } }catch{}
  try{ if(projetTxt) projet = JSON.parse(projetTxt); }catch{}
  try{ if(etatTxt){ const j = JSON.parse(etatTxt); if(j.__err) liveErr = j.__err; else live = resumeEtat(j); } }catch{ liveErr = 'données illisibles'; }
  return {

async function tree(repo, branch){
  const t = await gh(`/repos/${repo}/git/trees/${encodeURIComponent(branch||'HEAD')}?recursive=1`);
  return (t.tree||[]).filter(x => x.type === 'blob' && /\.(js|ts|html|css|json|sh|py|md)$/i.test(x.path) && !/node_modules|^lib\/|\.min\.|publication\//.test(x.path)).map(x => `${x.path} (${Math.round((x.size||0)/1024)} ko)`).slice(0, 150);
}
/* Commits récents avec leurs modifications (pour la revue) */
async function recentDiffs(repo, n=5, maxChars=45000){
  const list = await gh(`/repos/${repo}/commits?per_page=${n}`);
  let out = '', used = 0;
  for(const c of list){
    const d = await gh(`/repos/${repo}/commits/${c.sha}`);
    let block = `\n### Commit ${c.sha.slice(0,7)} — ${c.commit.message.split('\n')[0]} (${c.commit.author?.date})\n`;
    for(const f of d.files||[]){
      if(/\.(png|ico|icns|jpg|ttf|woff2?)$|^lib\/|publication\/|lightweight-charts|qrcode/i.test(f.filename)) continue;
      block += `\n--- ${f.filename} (${f.status}, +${f.additions}/-${f.deletions})\n${clip(f.patch||'(pas de diff)', 6000)}\n`;
    }
    if(used + block.length > maxChars){ out += `\n[${list.length} commits demandés, la suite est coupée pour rester dans la limite]`; break; }
    out += block; used += block.length;
  }
  return out;
}

const GEM = 'https://generativelanguage.googleapis.com/v1beta';
const today = () => new Date().toISOString().slice(0,10);
function gemErr(status, d){
  const m = d?.error?.message || '';
  if(status === 429) return 'Quota Gemini gratuit atteint, réessaie dans une minute';
  if(status === 400 && /API key/i.test(m)) return 'Clé Gemini refusée : vérifie-la dans les Réglages';
  if(status === 403) return 'Clé Gemini refusée (403) : ' + m;
  return `Gemini ${status} ${m}`.trim();
}
async function listModels(force=false){
  if(!force && C.models?.length && Date.now() - (C.modelsAt||0) < 864e5) return C.models;
  const r = await fetch(GEM + '/models?pageSize=200', {headers:{'x-goog-api-key':S.geminiKey}});
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(gemErr(r.status, d));
  C.models = (d.models||[]).filter(m => (m.supportedGenerationMethods||[]).includes('generateContent')).map(m => m.name.replace(/^models\//,''));
  C.modelsAt = Date.now(); saveC();
  return C.models;
}
/* Le plus récent « flash » stable d'abord, puis les « flash-lite », puis les préversions. Jamais « pro » (rarement gratuit). */
function rankModels(list){
  const P = n => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)-(flash|pro)(-lite)?(.*)$/); if(!m || m[2] === 'pro') return null;
    if(/tts|image|live|audio|embed|thinking|exp|computer|native/i.test(m[4])) return null;
    return {n, v:parseFloat(m[1]), lite:!!m[3], pre:/preview/.test(m[4]), alias:/latest/.test(m[4])}; };
  return list.map(P).filter(Boolean).sort((a, b) => (a.pre - b.pre) || (a.lite - b.lite) || (b.v - a.v) || (a.alias - b.alias) || a.n.length - b.n.length).map(x => x.n).slice(0, 5);
}
async function modelChain(){
  if(S.model && S.model !== 'auto') return [S.model.replace(/^models\//,'')];
  let list = [];
  try{ list = rankModels(await listModels()); }catch{}
  if(!list.length) list = ['gemini-2.5-flash', 'gemini-2.5-flash-lite'];
  const ok = list.filter(m => C.blocked?.[m] !== today());
  return ok.length ? ok : list;
}
async function gemini(input, {json=false, system=null, temperature=0.5}={}){
  if(!S.geminiKey) throw new Error('Clé Gemini manquante (onglet Réglages)');
  const contents = typeof input === 'string' ? [{role:'user', parts:[{text:input}]}] : input;
  const body = {contents, generationConfig:{temperature}};
  if(system) body.systemInstruction = {parts:[{text:system}]};
  if(json) body.generationConfig.responseMimeType = 'application/json';
  let last = null;
  for(const m of await modelChain()){
    let r, d;
    try{
      r = await fetch(`${GEM}/models/${encodeURIComponent(m)}:generateContent`, {method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':S.geminiKey}, body:JSON.stringify(body)});
      d = await r.json().catch(() => ({}));
    }catch(e){ throw new Error('Pas de réseau pour joindre Gemini'); }
    if(r.ok){
      const text = (d.candidates?.[0]?.content?.parts||[]).filter(p => !p.thought).map(p => p.text||'').join('').trim();
      if(!text){ last = new Error('Réponse vide de Gemini (' + m + ')'); continue; }
      C.lastModel = m; saveC();
      return json ? parseJSON(text) : text;
    }
    last = new Error(gemErr(r.status, d));
    if(r.status === 429){ if(/day|PerDay|daily/i.test(JSON.stringify(d))){ C.blocked[m] = today(); saveC(); } continue; }
    if([404, 500, 503].includes(r.status)) continue;
    throw last;
  }
  throw last || new Error('Aucun modèle Gemini disponible');
}

let TASK_DRAFT = [];
async function tasksFromText(text, defaultRepo){
  const apps = tracked();
  const r = await gemini(`Voici un texte (analyse, revue ou conversation) au sujet des apps de Clément :
"""
${clip(text, 12000)}
"""
Apps : ${apps.map(a => `${a.name} = ${a.repo}`).join(' ; ')}${defaultRepo ? `\nApp concernée par défaut : ${defaultRepo}` : ''}
Extrais les tâches de développement concrètes qui en découlent (5 au maximum, uniquement des choses à faire dans le code). Chaque tâche : titre court à l'infinitif, corps de 2 à 5 lignes avec le critère de réussite.
JSON strict : {"taches":[{"repo":"pseudo/depot","titre":"…","corps":"…"}]}`, {json:true, system:ROLE_CHEF});
  TASK_DRAFT = (r.taches||[]).filter(t => apps.some(a => a.repo === t.repo));
  if(!TASK_DRAFT.length) throw new Error('Aucune tâche concrète trouvée dans ce texte');
  modal(`<h2>Tâches proposées</h2><p class="muted sm">Coche celles à créer dans GitHub.</p>
    ${TASK_DRAFT.map((t, i) => `<label class="chk card" style="margin:8px 0"><input type="checkbox" data-td="${i}" checked><span><b>${esc(appBy(t.repo).emoji)} ${esc(t.titre)}</b><br><span class="sm muted">${esc(t.corps)}</span></span></label>`).join('')}
    <div class="btns"><button class="btn primary" data-action="createDraft">Créer les tâches cochées</button></div>`);
}

  async advise(){
    if(!tracked().length) return go('settings');
    if(!C.lastSync) await syncAll(true);
    busy.advise = true; render();
    try{
      const data = await gemini(`Nous sommes le ${dateFR(Date.now())}. Voici l'état de toutes les apps :

${contexteGlobal(2500)}

Choisis les 3 actions les plus utiles à faire maintenant, toutes apps confondues. Privilégie les tâches déjà ouvertes, les problèmes visibles dans l'état en direct, les petites actions qui débloquent beaucoup.
Pour chaque action, rédige "prompt_code" : une consigne complète, autonome, en français, prête à coller dans Claude Code (contexte de l'app, résultat attendu, contraintes : respecter les règles du cerveau, ne pas casser l'existant, publier une nouvelle version comme d'habitude ; critères de vérification).
JSON strict : {"resume":"2 phrases sur l'état global","actions":[{"app":"nom exact","repo":"pseudo/depot","titre":"action courte","pourquoi":"1 phrase","duree_min":30,"prompt_code":"…"}]}`, {json:true, system:ROLE_CHEF});
      C.today = {at:Date.now(), data}; saveC();
    }finally{ busy.advise = false; render(); }
  },
  showAdvicePrompt(el){
    const a = C.today?.data?.actions?.[+el.dataset.i]; if(!a) return;
    textModal('Consigne pour Claude', a.prompt_code || '(vide)', `<p class="muted sm">${esc(a.app)} · ${esc(a.titre)}</p>`);
  },
  async adviceIssue(el){
    const a = C.today?.data?.actions?.[+el.dataset.i]; if(!a) return;
    const repo = tracked().find(t => t.repo === a.repo)?.repo || tracked().find(t => t.name === a.app)?.repo;
    if(!repo) throw new Error('App introuvable : ' + a.app);
    await createIssue(repo, a.titre, `${a.pourquoi||''}\n\n### Consigne pour Claude\n${a.prompt_code||''}`);
    render();
  },

  async weekly(){
    busy.weekly = true; render();
    try{
      const since = new Date(Date.now() - 7*864e5).toISOString();
      const parts = await Promise.all(tracked().map(async a => {
        const [cm, closed] = await Promise.all([
          gh(`/repos/${a.repo}/commits?since=${since}&per_page=60`).catch(() => []),
          gh(`/repos/${a.repo}/issues?state=closed&since=${since}&per_page=30`).catch(() => [])
        ]);
        const v = C.apps[a.repo]?.version;
        return `## ${a.name}
Commits de la semaine (${cm.length}) : ${cm.map(c => c.commit.message.split('\n')[0]).join(' | ') || 'aucun'}
Tâches terminées : ${closed.filter(i => !i.pull_request && i.closed_at > since).map(i => i.title).join(' | ') || 'aucune'}
Tâches encore ouvertes : ${(C.apps[a.repo]?.issues||[]).map(i => i.title).slice(0,10).join(' | ') || 'aucune'}

/* ================= Gestes téléphone ================= */
(function gestes(){
  let y0 = null, dy = 0, lastY = 0;
  const ptr = $('#ptr');
  addEventListener('touchstart', e => { if(!$('#modal').hidden || view === 'chef') return; y0 = scrollY <= 0 ? e.touches[0].clientY : null; dy = 0; }, {passive:true});
  addEventListener('touchmove', e => {
    if(y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    ptr.style.transform = `translate(-50%, ${Math.min(dy, 110) * .6 - 60}px) rotate(${dy * 3}deg)`;
  }, {passive:true});
  addEventListener('touchend', () => {
    if(y0 == null) return;
    ptr.style.transform = '';
    if(dy > 80 && navigator.onLine){ syncAll(); if(navigator.vibrate) navigator.vibrate(10); }
    y0 = null;
  });
  // Feuille : glisser vers le bas depuis la poignée pour fermer
  let s0 = null, sd = 0;
  const sh = $('#modal .sheet');
  sh.addEventListener('touchstart', e => { if(e.target.closest('.grab') || sh.scrollTop <= 0 && e.target.closest('.grab, h2')) { s0 = e.touches[0].clientY; sd = 0; sh.style.transition = 'none'; } }, {passive:true});
  sh.addEventListener('touchmove', e => { if(s0 == null) return; sd = Math.max(0, e.touches[0].clientY - s0); sh.style.transform = `translateY(${sd}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if(s0 == null) return; sh.style.transition = ''; if(sd > 110) closeModal(); else sh.style.transform = ''; s0 = null; });
  // En-tête qui se marque et bouton + qui se cache quand on descend
  addEventListener('scroll', () => {
    $('header').classList.toggle('scrolled', scrollY > 4);
    const fab = $('#fab'); if(scrollY > lastY + 8 && scrollY > 120) fab.classList.add('hide'); else if(scrollY < lastY - 8) fab.classList.remove('hide');
    lastY = scrollY;
  }, {passive:true});
  // Zone de saisie du chef qui grandit avec le texte
  document.addEventListener('input', e => { if(e.target.id === 'chatIn'){ e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; } });
})();

/* ================= Démarrage ================= */
render();
if(navigator.onLine && S.ghToken && tracked().length && Date.now() - (C.lastSync||0) > 10*60e3) syncAll(true);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
